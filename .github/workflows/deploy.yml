name: Build and Deploy Sovereign Engine

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Target file path to commit'
        required: false
      file_content:
        description: 'Base64 encoded content'
        required: false
      commit_message:
        description: 'Commit message'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Uses the standard token since contents: write is declared above. 
          # Note: If main branch protection is enabled, change this to your GH_PAT secret.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set Git Identity
        run: |
          git config --global user.name "PG1 Sovereign Core Agent"
          git config --global user.email "agent@sovereign.core"

      - name: Apply Autonomous Patch If Dispatched
        if: ${{ github.event.inputs.file_path != '' }}
        run: |
          # Use --decode for cross-compatibility and ignore standard line wrapping
          echo "${{ github.event.inputs.file_content }}" | base64 --decode > "${{ github.event.inputs.file_path }}"
          
          # Stage the specific targeted file
          git add "${{ github.event.inputs.file_path }}"
          
          # Real-world safety check: Verify changes exist before committing to prevent workflow crash
          if git diff --staged --quiet; then
            echo "No changes detected in ${{ github.event.inputs.file_path }}. Skipping commit to prevent pipeline failure."
          else
            git commit -m "${{ github.event.inputs.commit_message || 'feat(agent): autonomous self-patch update' }}"
            git push origin main
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
