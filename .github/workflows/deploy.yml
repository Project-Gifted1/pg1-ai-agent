name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      command:
        description: 'Command or instructions for the agent'
        required: false
        default: 'rebuild interface'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Forcefully Create Worker Entry
        run: |
          cat << 'EOF' > worker-entry.js
          export default {
            async fetch(request, env, ctx) {
              return new Response("AI Agent active and online!", {
                headers: { "content-type": "text/plain" }
              });
            },
          };
          EOF

      - name: Deploy Worker to Cloudflare
        run: npx wrangler deploy worker-entry.js --name pg1-ai-agent --compatibility-date=2026-04-23
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
