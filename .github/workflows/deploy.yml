name: Build and Deploy Sovereign Engine

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy Worker Dynamically
        env:
          CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_TOKEN_3: ${{ secrets.CLOUDFLARE }}
        run: |
          TOKEN="${CF_TOKEN_1:-${CF_TOKEN_2:-$CF_TOKEN_3}}"
          if [ -z "$TOKEN" ]; then
            echo "Error: No Cloudflare API token found matching standard repository secret names."
            exit 1
          fi
          npx wrangler deploy --api-token "$TOKEN"
