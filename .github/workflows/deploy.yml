name: Sovereign Threat Feed Daily Strike

on:
  push:
    branches: [ main, pg1-agent ]
  workflow_dispatch:

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install requests networkx supabase
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Execute Autonomous Core
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLEKEY }}
          SUPABASE_SERVICE_ROLEKEY: ${{ secrets.SUPABASE_SERVICE_ROLEKEY }}
        run: |
          rm -f swarm_registry*
          echo "" | base64 -d > swarm_registry.py
          
          PYTHONPATH=$(pwd) python sovereign_autonomous_core.py
          if [ -f "sovereign_swarm_orchestrator.py" ]; then
            PYTHONPATH=$(pwd) python sovereign_swarm_orchestrator.py
          fi
