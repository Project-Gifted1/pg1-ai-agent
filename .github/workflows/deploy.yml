name: Sovereign Threat Feed Daily Strike

on:
  push:
    branches: [ main, pg1-agent ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Network Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests networkx supabase
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Execute Autonomous Core & Swarm Mesh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLEKEY }}
          SUPABASE_SERVICE_ROLEKEY: ${{ secrets.SUPABASE_SERVICE_ROLEKEY }}
        run: |
          # 1. Base64 bypass for swarm_registry corruption
          rm -f swarm_registry*
          echo "" | base64 -d > swarm_registry.py
          
          # 2. Force rename any dependencies with invisible mobile formatting characters
          find . -name "*worker_identity*.py" -exec mv {} worker_identity.py \; 2>/dev/null || true
          find . -name "*swarm_dispatcher*.py" -exec mv {} swarm_dispatcher.py \; 2>/dev/null || true
          find . -name "*swarm_auditor*.py" -exec mv {} swarm_auditor.py \; 2>/dev/null || true
          find . -name "*threat_validator*.py" -exec mv {} threat_validator.py \; 2>/dev/null || true
          
          # 3. Execute the Autonomous Core
          if [ -f "sovereign_autonomous_core.py" ]; then
            PYTHONPATH=$(pwd) python sovereign_autonomous_core.py
          else
            echo "sovereign_autonomous_core.py not found"
            exit 1
          fi
          
          # 4. Execute the Swarm Orchestrator
          if [ -f "sovereign_swarm_orchestrator.py" ]; then
            PYTHONPATH=$(pwd) python sovereign_swarm_orchestrator.py
          fi

      - name: Execute OTX API Sync
        env:
          OTX_API: ${{ secrets.OTX_API }}
        run: |
          if [ -f "build_pipeline.py" ]; then
            PYTHONPATH=$(pwd) python build_pipeline.py
          fi
 