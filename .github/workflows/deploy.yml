name: Sovereign Threat Feed Daily Strike

on:
  push:
    branches: [ main, pg1-agent ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Network Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests networkx supabase
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Execute Autonomous Core & Swarm Mesh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLEKEY }}
        run: |
          python -c "import os; [os.rename(f, f.strip().replace(' ', '')) for f in os.listdir('.') if ' ' in f or f != f.strip()]"
          PYTHONPATH=$(pwd) python sovereign_autonomous_core.py
          PYTHONPATH=$(pwd) python sovereign_swarm_orchestrator.py

      - name: Execute OTX API Sync
        env:
          OTX_API: ${{ secrets.OTX_API }}
        run: |
          if [ -f "build_pipeline.py" ]; then
            PYTHONPATH=$(pwd) python build_pipeline.py
          fi
