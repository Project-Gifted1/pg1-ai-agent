name: PG1 lab

# One PG1 lab experiment (lib/lab, dispatched by /lab start in the chat).
#
# Isolation. Secrets come from the GitHub environment "lab" (or the
# repository): PG1_LAB_DISPATCH_SECRET (required, no fallback),
# PG1_LAB_ANTHROPIC_API_KEY / PG1_LAB_GEMINI_API_KEY (lab keys with their own
# small spend limits; when unset, the repository's ANTHROPIC_API_KEY /
# GEMINI_API_KEY_PAID, still capped by the signed budget) and
# PG1_LAB_GITHUB_TOKEN (fine-grained: this repository only, Contents and
# Pull requests read/write; when unset, the pull job's built-in token with
# exactly those two permissions). No payment key, no production Supabase
# key, no wallet: this file names no other secret, and tests/lab.test.mjs
# fails if it ever does.
#
# A draft PR opened with the built-in token does NOT trigger the Tests
# workflow (GitHub never starts workflows for the built-in token's pushes
# and PRs). The promotion gate then finds no "npm test" check on the PR head
# and fails closed ("CI none") until the operator starts CI themselves:
# close and reopen the draft PR, or push a commit to lab/<id>.
#
# Three jobs on three fresh runners, and the notice:
#   experiment  model calls only (POSTs to model APIs; research GETs public
#               pages through lib/netGuard.mjs); writes the result and, for
#               a code experiment, the proposed files
#   test        code experiments only: applies the files and runs the test
#               suite with NO secrets and the network blocked
#   pull        code experiments only, and only when the tests passed: a
#               fresh checkout commits exactly the proposed files to
#               lab/<id>, pushes, and opens a DRAFT pull request. PG1 never
#               merges it.
#   notify      always: one signed result notice to PG1
#               (/api/hooks/lab at PG1_URL, default the production URL) so the
#               experiment is synced and reported at once
#   verdict     always, last: fails the run (red) when the experiment did
#               not end done or the lab's test run failed
#               (scripts/lab-verdict.mjs), so self-healing picks it up.
#               The experiment job also exits 1 on a failed run
#               (scripts/lab-run.mjs); test and pull are then skipped.
# Hard limits: the runner stops at the signed budget and
# PG1_LAB_MAX_MINUTES; each job has its own timeout.

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: Experiment id (set by PG1)
        required: true
        type: string
      kind:
        description: research, skill or code
        required: true
        type: choice
        options: [research, skill, code]
      goal:
        description: What the experiment is for
        required: true
        type: string
      input:
        description: Base64 JSON input (set by PG1)
        required: false
        type: string
        default: ''
      budget_usd:
        description: This experiment's budget in USD (signed)
        required: true
        type: string
      token:
        description: Signed dispatch token (set by PG1)
        required: true
        type: string

run-name: lab ${{ inputs.experiment_id }}

permissions:
  contents: read

concurrency:
  group: lab-${{ inputs.experiment_id }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    environment: lab
    timeout-minutes: 20
    steps:
      - name: Mask the dispatch token
        env:
          LAB_TOKEN: ${{ inputs.token }}
        run: echo "::add-mask::$LAB_TOKEN"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Run the experiment
        timeout-minutes: 17
        env:
          LAB_ID: ${{ inputs.experiment_id }}
          LAB_KIND: ${{ inputs.kind }}
          LAB_GOAL: ${{ inputs.goal }}
          LAB_INPUT: ${{ inputs.input }}
          LAB_BUDGET_USD: ${{ inputs.budget_usd }}
          LAB_TOKEN: ${{ inputs.token }}
          PG1_LAB_DISPATCH_SECRET: ${{ secrets.PG1_LAB_DISPATCH_SECRET }}
          PG1_LAB_ANTHROPIC_API_KEY: ${{ secrets.PG1_LAB_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          PG1_LAB_GEMINI_API_KEY: ${{ secrets.PG1_LAB_GEMINI_API_KEY || secrets.GEMINI_API_KEY_PAID }}
          PG1_LAB_MAX_MINUTES: '15'
          # Unset is $0 (lib/aiRouter.mjs): the runner then calls no paid
          # engine and runs on the free engines below (lab data is the
          # operator's own); web search, which needs a paid engine, is
          # skipped and named in the report.
          PG1_DAILY_SPEND_CAP_USD: ${{ vars.PG1_DAILY_SPEND_CAP_USD }}
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.PG1_MODELS_TOKEN }}
          # Cloudflare Workers AI: a free engine the film and music renders
          # already use (lib/lab/policy.mjs allows api.cloudflare.com), so a
          # $0 run has another engine to fall back on when one is resting.
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/lab-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-result-${{ inputs.experiment_id }}
          path: lab-out/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  test:
    needs: experiment
    if: inputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: lab-result-${{ inputs.experiment_id }}
          path: lab-out
      - name: Apply the proposed change and run the tests (no secrets, network blocked)
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --import=./tests/ci/no-network.mjs
        run: |
          set +e
          if [ ! -f lab-out/patch.json ]; then echo '{"passed":false,"summary":"no patch"}' > "$RUNNER_TEMP/test.json"; exit 0; fi
          node scripts/lab-apply.mjs lab-out/patch.json > "$RUNNER_TEMP/test.log" 2>&1 && npm test >> "$RUNNER_TEMP/test.log" 2>&1
          code=$?
          node -e 'const fs=require("fs");const log=fs.readFileSync(process.argv[1],"utf8");fs.writeFileSync(process.argv[2],JSON.stringify({passed:process.argv[3]==="0",summary:log.split("\n").filter(l=>/^# (tests|pass|fail|skipped)/.test(l)||/^not ok/.test(l)).slice(-40).join("\n")}))' "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/test.json" "$code"
      - uses: actions/upload-artifact@v4
        with:
          name: lab-test-${{ inputs.experiment_id }}
          path: ${{ runner.temp }}/test.json
          retention-days: 14

  pull:
    needs: [experiment, test]
    if: inputs.kind == 'code'
    runs-on: ubuntu-latest
    environment: lab
    timeout-minutes: 10
    # For the built-in token fallback only; a set PG1_LAB_GITHUB_TOKEN carries
    # its own (same) permissions.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: lab-result-${{ inputs.experiment_id }}
          path: lab-out
      - uses: actions/download-artifact@v4
        with:
          name: lab-test-${{ inputs.experiment_id }}
          path: lab-out
      - name: Push the branch and open a draft pull request
        env:
          PG1_LAB_GITHUB_TOKEN: ${{ secrets.PG1_LAB_GITHUB_TOKEN || github.token }}
          PG1_LAB_PR_TOKEN: ${{ secrets.PG1_LAB_GITHUB_TOKEN != '' && 'lab' || 'builtin' }}
        run: |
          if [ -f lab-out/patch.json ]; then node scripts/lab-pr.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-result-${{ inputs.experiment_id }}
          path: lab-out/result.json
          retention-days: 14
          overwrite: true

  verdict:
    # Red when the experiment failed: reads the final result artifact only
    # (no secret, no npm, no network).
    needs: [experiment, test, pull, notify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lab-result-${{ inputs.experiment_id }}
          path: lab-out
      - name: Fail the run when the experiment failed
        run: node scripts/lab-verdict.mjs lab-out/result.json

  notify:
    # The result notice: when every other job is done (passed, failed or
    # skipped), one signed POST tells PG1 to sync this experiment now instead
    # of waiting for the webhook or the re-sync cron. Signed with the lab's own
    # PG1_LAB_DISPATCH_SECRET over "<timestamp>.<body>"; carries only the
    # experiment id, this run's id and the experiment job's result, never the
    # findings. No checkout, no npm, no write permission. It goes to the
    # repository (or "lab" environment) variable PG1_URL, or to
    # https://pg1-ai-agent.vercel.app when that variable is not set; without
    # the dispatch secret the step does nothing. A failed notice never fails
    # the run.
    needs: [experiment, test, pull]
    if: always()
    runs-on: ubuntu-latest
    environment: lab
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send the signed result notice to PG1
        continue-on-error: true
        env:
          PG1_LAB_DISPATCH_SECRET: ${{ secrets.PG1_LAB_DISPATCH_SECRET }}
          PG1_URL: ${{ vars.PG1_URL || 'https://pg1-ai-agent.vercel.app' }}
          LAB_ID: ${{ inputs.experiment_id }}
          RUN_ID: ${{ github.run_id }}
          EXPERIMENT_RESULT: ${{ needs.experiment.result }}
        run: |
          node -e '
            const crypto = require("crypto");
            const base = String(process.env.PG1_URL || "").replace(/\/+$/, "");
            const secret = process.env.PG1_LAB_DISPATCH_SECRET || "";
            if (!/^https:\/\//.test(base) || !secret) { console.log("PG1_URL or the dispatch secret is not set: no notice sent."); process.exit(0); }
            const body = JSON.stringify({ experiment_id: process.env.LAB_ID, run_id: Number(process.env.RUN_ID), conclusion: process.env.EXPERIMENT_RESULT || "unknown" });
            const ts = String(Math.floor(Date.now() / 1000));
            const sig = "sha256=" + crypto.createHmac("sha256", secret).update(ts + "." + body).digest("hex");
            fetch(base + "/api/hooks/lab", { method: "POST", headers: { "Content-Type": "application/json", "X-PG1-Timestamp": ts, "X-PG1-Signature": sig }, body, signal: AbortSignal.timeout(20000) })
              .then((r) => console.log("PG1 answered " + r.status))
              .catch((e) => console.log("PG1 could not be reached: " + e.name));
          '
