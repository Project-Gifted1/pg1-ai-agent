name: Storage report and move large media to R2

# Run by hand (Actions > this workflow > Run workflow). "report" lists what
# takes the space in pg1-vault; "move" copies every large media file (video
# and movie masters, previews, cuts, clips, stems, music masters and
# exports, Motion clips) to R2 and repoints the database at it; "move and
# delete" also deletes each vault copy once it has moved
# (scripts/move-large-media-to-r2.mjs).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report, move, or move-delete'
        required: true
        default: report
        type: choice
        options: [report, move, move-delete]

permissions:
  contents: read

concurrency:
  group: storage-move
  cancel-in-progress: false

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Report / move
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            report) node scripts/move-large-media-to-r2.mjs ;;
            move) node scripts/move-large-media-to-r2.mjs --move ;;
            move-delete) node scripts/move-large-media-to-r2.mjs --move --delete ;;
            *) echo "unknown mode"; exit 2 ;;
          esac
