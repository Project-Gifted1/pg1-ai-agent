name: PG1 Studio render

# One stage of one PG1 Studio film (storyboard, preview or full render),
# dispatched by api/chat.mjs after the operator approves it
# (lib/film/dispatch.mjs). Long renders run here, never in a Vercel
# function. The worker (scripts/film-render.mjs) refuses a run whose token
# does not verify against PG1_VIDEO_RENDER_SECRET, and only claims a film
# that is queued for this stage, so a stray or repeated run spends nothing.
# Two more stages: director (Director Mode runs every stage of one film
# alone, docs/director-mode.md) and voice_check (one fixed test line in the
# ElevenLabs brand voice, kept as the run's artifact; no film, no database).

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Film id
        required: true
        type: string
      stage:
        description: storyboard, preview, full, director, or voice_check (one test line in the brand voice; no film)
        required: true
        type: choice
        options: [storyboard, preview, full, director, voice_check]
      token:
        description: Signed render token (set by PG1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: film-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  render:
    name: render ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Mask the render token
        env:
          FILM_TOKEN: ${{ inputs.token }}
        run: echo "::add-mask::$FILM_TOKEN"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -filters | grep -E ' (subtitles|xfade|loudnorm|sidechaincompress|zoompan) '
      - run: npm ci --omit=dev --ignore-scripts
      - name: Render
        env:
          FILM_PROJECT_ID: ${{ inputs.project_id }}
          FILM_STAGE: ${{ inputs.stage }}
          FILM_TOKEN: ${{ inputs.token }}
          PG1_VIDEO_RENDER_SECRET: ${{ secrets.PG1_VIDEO_RENDER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Large files (clips, masters, previews, the 9:16 cut, stems) go to
          # Cloudflare R2 (lib/storage/r2.mjs); without these they stay in
          # Supabase storage as before.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          # Text engines in fallback order (lib/film/providers.mjs). Paid keys
          # only: the free Gemini key is never given to this job. The paid
          # Gemini key is also the media fallback when Replicate is out of
          # credit or still throttled (stills and clips, rest of the stage).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY_PAID: ${{ secrets.GEMINI_API_KEY_PAID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Film music beds: Lyria on the paid Gemini key, then the Lyria
          # clip model (lib/music/engines.mjs filmMusicPlan). Never
          # Replicate, and never ElevenLabs Music: the plan excludes film
          # (lib/film/providers.mjs filmMusicExclude). A bed neither can
          # make is left out and the film finishes without it.
          PG1_MUSIC_LYRIA_MODEL: ${{ vars.PG1_MUSIC_LYRIA_MODEL }}
          PG1_MUSIC_LYRIA_CLIP_MODEL: ${{ vars.PG1_MUSIC_LYRIA_CLIP_MODEL }}
          # Voiceover: Cartesia, sent once more on a timeout or outage, then
          # ElevenLabs TTS (Creator plan) for the rest of the stage
          # (createFilmVoice). Either key will do; both is safest.
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID: ${{ vars.CARTESIA_VOICE_ID }}
          CARTESIA_MODEL_ID: ${{ vars.CARTESIA_MODEL_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PG1_FILM_VOICE_ID: ${{ vars.PG1_FILM_VOICE_ID }}
          PG1_FILM_ELEVENLABS_VOICE_ID: ${{ vars.PG1_FILM_ELEVENLABS_VOICE_ID }}
          PG1_FILM_ELEVENLABS_TTS_MODEL: ${{ vars.PG1_FILM_ELEVENLABS_TTS_MODEL }}
          PG1_FILM_VOICE_TIMEOUT_MS: ${{ vars.PG1_FILM_VOICE_TIMEOUT_MS }}
          PG1_VIDEO_MODEL_REPLICATE_IMAGE: ${{ vars.PG1_VIDEO_MODEL_REPLICATE_IMAGE }}
          PG1_VIDEO_MODEL: ${{ vars.PG1_VIDEO_MODEL }}
          PG1_FILM_GEMINI_STILL_MODEL: ${{ vars.PG1_FILM_GEMINI_STILL_MODEL }}
          PG1_FILM_STILL_MODEL: ${{ vars.PG1_FILM_STILL_MODEL }}
          PG1_FILM_MUSIC_MODEL: ${{ vars.PG1_FILM_MUSIC_MODEL }}
          PG1_FILM_CLAUDE_MODEL: ${{ vars.PG1_FILM_CLAUDE_MODEL }}
          PG1_FILM_CONCURRENCY: ${{ vars.PG1_FILM_CONCURRENCY }}
          # Capacity alerts and the end-of-film push to the operator's devices.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          PG1_DIRECTOR_CLIENT_APPROVAL: ${{ vars.PG1_DIRECTOR_CLIENT_APPROVAL }}
          PG1_STUDIO_LOGO_PATH: ${{ vars.PG1_STUDIO_LOGO_PATH }}
          VOICE_CHECK_OUT: ${{ runner.temp }}/voice-check.wav
        run: node scripts/film-render.mjs
      - name: Keep the voice check line
        if: inputs.stage == 'voice_check'
        uses: actions/upload-artifact@v4
        with:
          name: voice-check
          path: ${{ runner.temp }}/voice-check.wav
          retention-days: 7
