name: Gemini key test (one-off)
# Throwaway, run once at the operator's request: one 1-token request per key
# to tell which of GEMINI_API_KEY_1 / GEMINI_API_KEY_2 is the free key. Prints
# only a category per key (free / paid / unset / unclear), never a value or a
# response body. Deleted after its run.
on:
  push:
    branches: [claude/pg1-tool-sandbox-prs-315j7l-gemini-key-test]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Classify each key
        env:
          KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          node --input-type=module -e '
          const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent";
          async function classify(key) {
            if (!key) return "unset";
            let status = 0, text = "";
            try {
              const r = await fetch(url, { method: "POST", headers: { "x-goog-api-key": key, "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "hi" }] }], generationConfig: { maxOutputTokens: 1 } }), signal: AbortSignal.timeout(20000) });
              status = r.status; text = await r.text();
            } catch (e) { return "unclear (no answer)"; }
            if (status === 200) return "FREE (answers normally; the paid key is out of credit)";
            if (status === 402 || /prepa(y|id)|credit|billing/i.test(text)) return "PAID (out of credit)";
            if (status === 429 && /free_tier/i.test(text)) return "FREE (free-tier quota resting)";
            if (/api key not valid|API_KEY_INVALID/i.test(text)) return "invalid key";
            return "unclear (status " + status + ")";
          }
          console.log("GEMINI_API_KEY_1: " + await classify(process.env.KEY_1));
          console.log("GEMINI_API_KEY_2: " + await classify(process.env.KEY_2));
          '
