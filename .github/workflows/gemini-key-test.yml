name: Gemini key test (one-off)
# Throwaway, at the operator's request: one 1-token request per Gemini key to
# tell free from paid. Prints only a category and the HTTP status per key,
# never a value or a response body. Deleted after its run.
on:
  push:
    branches: [claude/pg1-tool-sandbox-prs-315j7l-gemini-key-test]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Classify each key
        env:
          K_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          K_GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          K_GEMINI_API_KEY_PAID: ${{ secrets.GEMINI_API_KEY_PAID }}
        run: |
          node --input-type=module -e '
          const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent";
          async function classify(key) {
            if (!key) return "unset";
            let status = 0, text = "";
            try {
              const r = await fetch(url, { method: "POST", headers: { "x-goog-api-key": key, "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "hi" }] }], generationConfig: { maxOutputTokens: 1 } }), signal: AbortSignal.timeout(20000) });
              status = r.status; text = await r.text();
            } catch (e) { return "unclear (no answer)"; }
            const freeTierQuota = /free_tier/i.test(text);
            const prepaid = /prepayment|prepaid/i.test(text);
            if (status === 200) return "answers normally (200)";
            if (status === 402 || prepaid) return "PAID: prepaid credits used up (" + status + ")";
            if (status === 429 && freeTierQuota) return "FREE: free-tier quota used up for now (429)";
            if (status === 429) return "rate limited, tier not named (429)";
            if (/api key not valid|API_KEY_INVALID/i.test(text)) return "invalid key (" + status + ")";
            return "unclear (" + status + ")";
          }
          for (const name of ["GEMINI_API_KEY", "GEMINI_API_KEY2", "GEMINI_API_KEY_PAID"]) console.log(name + ": " + await classify(process.env["K_" + name]));
          '
