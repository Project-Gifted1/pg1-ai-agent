name: PG1 Sovereign Sentinel

on:
  workflow_dispatch:

jobs:
  fix-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          
      - name: Fix Line 896 in api/chat.js
        run: |
          node -e '
          const fs = require("fs");
          let file = "api/chat.js";
          let lines = fs.readFileSync(file, "utf8").split("\n");
          if (lines.length >= 896) {
            console.log("Line 896 before:", lines[895]);
            lines[895] = "          const generatedImageUrl = \"\";";
            fs.writeFileSync(file, lines.join("\n"));
            console.log("Replaced line 896 successfully.");
          }
          '
          
      - name: Commit and Push
        run: |
          git config user.name "PG1 Sovereign Agent"
          git config user.email "admin@pg1.local"
          git add api/chat.js
          git commit -m "Fix: Clean syntax error on line 896 of api/chat.js"
          git push
