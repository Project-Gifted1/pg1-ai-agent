name: PG1 Sovereign Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sentinel-check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Vercel Diagnostic Gateway
        run: |
          curl -f -X POST https://pg1-ai-agent.vercel.app/api/chat \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
          -d '{"prompt": "AUTH_VERIFY"}'
