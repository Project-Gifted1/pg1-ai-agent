name: PG1 Sovereign Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sentinel-check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Vercel Diagnostic Gateway
        run: |
          curl -f -X POST ${{ secrets.VERCEL_APP_URL }}/api/chat \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -d '{"prompt": "AUTH_VERIFY"}'
