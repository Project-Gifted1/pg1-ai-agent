name: PG1 Sovereign Sentinel

on:
  workflow_dispatch:

jobs:
  fix-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          
      - name: Repair api/chat.js Syntax
        run: |
          node -e '
          const fs = require("fs");
          let file = "api/chat.js";
          if (fs.existsSync(file)) {
            let content = fs.readFileSync(file, "utf8");
            // Fix unescaped or broken template string interpolation causing the syntax error near line 896
            content = content.replace(/generated_img_\$/g, "generated_img_");
            fs.writeFileSync(file, content);
            console.log("Repaired syntax in api/chat.js");
          }
          '
          
      - name: Commit and Push
        run: |
          git config user.name "PG1 Sovereign Agent"
          git config user.email "admin@pg1.local"
          git add api/chat.js
          git commit -m "Fix: Resolve syntax error at line 896 in api/chat.js"
          git push
