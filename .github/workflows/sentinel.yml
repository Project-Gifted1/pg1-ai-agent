name: PG1 Sovereign Sentinel

on:
  workflow_dispatch:

jobs:
  patch-imagen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          
      - name: Inject Imagen 3 Endpoint Fix
        run: |
          node -e '
          const fs = require("fs");
          let files = ["api/image.js", "api/generate.js", "api/chat.js"];
          let patched = false;
          for (let file of files) {
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              if (content.includes("imagen-3.0")) {
                content = content.replace(/imagen-3\.0[^"'\s]+/g, "imagen-3.0-generate-001");
                fs.writeFileSync(file, content);
                console.log("Patched model string in " + file);
                patched = true;
              }
            }
          }
          if (!patched) {
            console.log("Target file with imagen model string not found, verifying directory structure.");
          }
          '
          
      - name: Commit and Push
        run: |
          git config user.name "PG1 Sovereign Agent"
          git config user.email "admin@pg1.local"
          git add -A
          git commit -m "Patch: Update endpoint to imagen-3.0-generate-001" || echo "No changes to commit"
          git push
