name: PG1 Sovereign Sentinel

on:
  workflow_dispatch:

jobs:
  direct-repo-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          
      - name: Native Code Injection
        run: |
          node -e '
          const fs = require("fs");
          const target = "} else if (lower.startsWith('\''/sync-vault'\'')) {";
          const replace = "} else if (lower.startsWith('\''/commerce-status'\'')) { return sendJSON(200, { reply: \"### [ COMMERCIAL GATEWAY STATUS ]\\\\n- **Gumroad Node**: ACTIVE\\\\n- **Telemetry Route**: /api/ioc (Awaiting Agent Checkout)\" }); } else if (lower.startsWith('\''/sync-vault'\'')) {";
          let code = fs.readFileSync("api/chat.js", "utf8");
          fs.writeFileSync("api/chat.js", code.replace(target, replace));
          '
          
      - name: Commit and Auto-Deploy
        run: |
          git config user.name "PG1 Sovereign Agent"
          git config user.email "admin@pg1.local"
          git add api/chat.js
          git commit -m "Patch: Inject /commerce-status diagnostic route"
          git push
