name: PG1 Showcase render

# Art-directed shots of PG1 City and PG1 Universe, rendered offline
# (scripts/showcase-render.mjs): headless Chromium at the desktop-only
# Showcase profile, the clock stepped frame by frame at 30 fps, frames
# encoded with ffmpeg (H.264, -preset veryfast, CRF 18, yuv420p). Started by
# hand only (Actions > PG1 Showcase render > Run workflow). The MP4s, a PNG
# still of each shot and manifest.json are uploaded as the run's artifact.
#
# No secrets are needed. With read_pg1_data on and PG1's database secrets
# set in this repository, the City shows the last 24 hours of real PG1
# events (never payments) and the first universe is read through a store
# that refuses every write (never stepped, reset or changed); without them
# the City is calm and the universe shot uses the universe template.
# manifest.json says which data each shot used.
#
# Reel mode (reel: inside-city, the 24 Nov post): the thirteen City shots (day and night) of
# lib/showcase/reel.mjs, each on its own runner at once, all replaying the
# same real 7-day window of the defence feed (one epoch for every job).
# Each job's artifact holds its MP4, still and manifest; the post is built
# from them with scripts/social-inside-city.mjs.

on:
  workflow_dispatch:
    inputs:
      shots:
        description: Shots, comma-separated (city-night, city-rain, first-universe, benin-warri, deep-space)
        required: false
        default: city-night,city-rain,first-universe,benin-warri,deep-space
        type: string
      size:
        description: Frame size, WxH (1080x1920 vertical, 1920x1080 landscape)
        required: false
        default: 1080x1920
        type: string
      read_pg1_data:
        description: Read PG1's real events and first universe (read only) if the database secrets are set
        required: false
        default: true
        type: boolean
      social:
        description: Also build the post visuals (cards, cover, highlights.mp4; vertical size only)
        required: false
        default: false
        type: boolean
      reel:
        description: A reel instead of the shots above (inside-city), one runner a shot
        required: false
        default: ''
        type: string
      reel_shots:
        description: The reel's shots, comma-separated (empty for all of them)
        required: false
        default: ''
        type: string
      reel_epoch:
        description: The data window's "now" (ISO, e.g. 2026-11-24T00:14:54Z) to re-render shots on an earlier run's window; empty for now
        required: false
        default: ''
        type: string
      release_tag:
        description: Publish a post's reel as a release asset under this tag (e.g. social-2026-11-24), built from release_run's reel artifacts; nothing is rendered
        required: false
        default: ''
        type: string
      release_run:
        description: The run id whose reel artifacts the release is built from; "REEL_RUN,STILLS_RUN" takes the slides' and Story's stills from a stills-only run and keeps the published reel
        required: false
        default: ''
        type: string
      stills_only:
        description: Reel mode, the 2x stills alone (slides and Story), no MP4s; set reel_epoch to the reel run's window
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: showcase
  cancel-in-progress: false

jobs:
  # Reel mode: the shot list and one "now" for every job's data window.
  plan:
    if: inputs.reel != ''
    runs-on: ubuntu-24.04
    outputs:
      shots: ${{ steps.p.outputs.shots }}
      epoch: ${{ steps.p.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: p
        env:
          REEL: ${{ inputs.reel }}
          REEL_SHOTS: ${{ inputs.reel_shots }}
          REEL_EPOCH: ${{ inputs.reel_epoch }}
        run: |
          node -e "import('./lib/showcase/reel.mjs').then(m => { if (process.env.REEL !== m.REEL_ID) throw new Error('unknown reel'); const all = m.REEL_SHOTS.map(s => s.id); const want = (process.env.REEL_SHOTS || '').split(',').map(s => s.trim()).filter(Boolean); for (const w of want) if (!all.includes(w)) throw new Error('unknown shot ' + w); console.log('shots=' + JSON.stringify(want.length ? want : all)); })" >> "$GITHUB_OUTPUT"
          if [ -n "$REEL_EPOCH" ]; then
            if ! printf '%s' "$REEL_EPOCH" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$'; then echo "reel_epoch must be an ISO UTC time" >&2; exit 1; fi
            echo "epoch=$REEL_EPOCH" >> "$GITHUB_OUTPUT"
          else
            echo "epoch=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          fi

  reel:
    if: inputs.reel != ''
    needs: plan
    name: reel ${{ matrix.shot }}
    runs-on: ubuntu-24.04
    # The event shots draw about 100 s a frame in software 3D (135 frames and
    # a 2x still): just under GitHub's 6-hour limit.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.plan.outputs.shots) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium (version pinned by package-lock.json) and ffmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render ${{ matrix.shot }} (software 3D, real 7-day window, read only)
        env:
          REEL: ${{ inputs.reel }}
          SHOT: ${{ matrix.shot }}
          EPOCH: ${{ needs.plan.outputs.epoch }}
          SUPABASE_URL: ${{ inputs.read_pg1_data && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.read_pg1_data && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        # --warmup 12: the warm-up still runs until shaders and textures are stable (renderReelShot), without 40 frames at 100 s each.
          STILLS_ONLY: ${{ inputs.stills_only && '--stills-only' || '' }}
        run: node scripts/showcase-render.mjs --reel "$REEL" --shots "$SHOT" --epoch "$EPOCH" --warmup 12 $STILLS_ONLY --out showcase-out
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg1-reel-${{ github.run_number }}-${{ matrix.shot }}
          path: |
            showcase-out/*.mp4
            showcase-out/*.png
            showcase-out/manifest-*.json
          if-no-files-found: warn
          retention-days: 30

  render:
    if: inputs.reel == '' && inputs.release_tag == ''
    name: render
    # Pinned: Playwright 1.56.1 cannot install Chromium on ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium (version pinned by package-lock.json) and ffmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Render (software 3D, one shot per core)
        env:
          SHOTS: ${{ inputs.shots }}
          SIZE: ${{ inputs.size }}
          SUPABASE_URL: ${{ inputs.read_pg1_data && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.read_pg1_data && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: node scripts/showcase-render.mjs --shots "$SHOTS" --size "$SIZE" --jobs "$(nproc)" --out showcase-out
      - name: Post visuals
        if: inputs.social
        run: node scripts/social-build.mjs --from showcase-out --out showcase-out/social
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg1-showcase-${{ github.run_number }}
          path: |
            showcase-out/*.mp4
            showcase-out/*.png
            showcase-out/manifest.json
            showcase-out/social/
          if-no-files-found: warn
          retention-days: 30

  # Release mode: the post built from an earlier reel run's artifacts
  # (scripts/social-inside-city.mjs, the same build as by hand), and its
  # reel published as a release asset: MP4s stay out of git. The built post
  # (slides, Story, contact sheet, copy.md) is uploaded as the artifact.
  release:
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium (version pinned by package-lock.json), ffmpeg and the flag font
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
      - id: runs
        env:
          RUNS: ${{ inputs.release_run }}
        run: |
          if ! printf '%s' "$RUNS" | grep -Eq '^[0-9]+(,[0-9]+)?$'; then echo "release_run must be RUN or REEL_RUN,STILLS_RUN" >&2; exit 1; fi
          echo "reel=${RUNS%%,*}" >> "$GITHUB_OUTPUT"
          case "$RUNS" in *,*) echo "stills=${RUNS#*,}" >> "$GITHUB_OUTPUT";; *) echo "stills=" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.runs.outputs.reel }}
          github-token: ${{ github.token }}
          pattern: pg1-reel-*
          path: reel-artifacts
      - if: steps.runs.outputs.stills != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.runs.outputs.stills }}
          github-token: ${{ github.token }}
          pattern: pg1-reel-*
          path: stills-artifacts
      # The stills-only run's 2x stills replace the reel run's (same shots, same data window); its manifests are not used.
      - name: Take the newer stills
        if: steps.runs.outputs.stills != ''
        run: |
          n=0
          for f in $(find stills-artifacts -name '*-still-2x.png'); do
            b=$(basename "$f"); old=$(find reel-artifacts -name "$b" | head -1)
            if [ -z "$old" ]; then echo "no $b in the reel run" >&2; exit 1; fi
            cp "$f" "$old"; n=$((n+1)); echo "still: $b"
          done
          [ "$n" -gt 0 ] || { echo "no stills in run ${{ steps.runs.outputs.stills }}" >&2; exit 1; }
      - name: Build the post
        run: node scripts/social-inside-city.mjs --from reel-artifacts --out post
      - name: Publish the reel as a release asset
        # A stills-only rebuild keeps the published reel as it is.
        if: steps.runs.outputs.stills == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^social-[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then echo "release_tag must be social-YYYY-MM-DD" >&2; exit 1; fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Social post $TAG" --notes "The reel for the post (docs/social/, copy.md). Rendered by the PG1 Showcase render, run ${{ steps.runs.outputs.reel }}."
          gh release upload "$TAG" post/reel-1080x1920.mp4 --repo "$GITHUB_REPOSITORY" --clobber
      # The built post as a branch too (post/<tag>): artifacts cannot be read
      # from every network, git can. Slides, Story, contact sheets and copy.md;
      # never the MP4. Copy the files into docs/social/ in a PR to keep them.
      - name: Push the built post to post/${{ inputs.release_tag }}
        env:
          TAG: ${{ inputs.release_tag }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p post-branch && cp post/*.png post/*.jpg post/copy.md post-branch/
          cd post-branch && git init -q -b "post/$TAG" && git add -A
          git -c user.name=pg1-showcase -c user.email=pg1-showcase@users.noreply.github.com commit -q -m "Built post $TAG (runs ${{ inputs.release_run }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "post/$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: pg1-post-${{ inputs.release_tag }}
          path: post/
          retention-days: 30
