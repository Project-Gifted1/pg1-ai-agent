name: Tests

# Runs the test suite on every pull request and every push to main.
# No secrets: the tests run on mocks and fixtures only. tests/ci/no-network.mjs
# is loaded into every test process and fails the run if any test (Node or
# Chromium) tries to reach a host other than this machine.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    # The whole suite takes about 18 minutes on main and more with the
    # sandbox's longer world runs; 20 cancelled good runs.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The film tests (end-to-end render, image placement) skip without
      # ffmpeg. Same packages as film-render.yml. python3-cryptography: the
      # Python offline verifier in /docs/agents is run by
      # tests/signing-discovery.test.mjs, which fails in CI without it.
      - name: Install ffmpeg, fonts and python3-cryptography
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-cryptography
          ffmpeg -version | head -1
          python3 -c "import cryptography; print('cryptography', cryptography.__version__)"
      # Chromium is not installed in this job, so tests/browser/ skip here
      # and run in the browser job below.
      - name: npm test (network blocked)
        env:
          NODE_OPTIONS: --import=./tests/ci/no-network.mjs
          PG1_NET_GUARD_LOG: ${{ runner.temp }}/network-violations.jsonl
        run: |
          set -o pipefail
          npm test | tee "$RUNNER_TEMP/unit.tap"
          # ffmpeg is installed above, so a film test skipping for want of it
          # would be a silent pass; treat it as a failure.
          if grep -q '# SKIP ffmpeg is not installed' "$RUNNER_TEMP/unit.tap"; then
            echo "::error::Film tests were skipped: ffmpeg not found"
            exit 1
          fi
      # The full log is long; a failing test is easier to find here.
      - name: Show failing tests
        if: failure()
        run: grep -n -A30 '^ *not ok' "$RUNNER_TEMP/unit.tap" || true
      - name: Fail on any attempted network access
        if: always()
        env:
          PG1_NET_GUARD_LOG: ${{ runner.temp }}/network-violations.jsonl
        run: |
          if [ -s "$PG1_NET_GUARD_LOG" ]; then
            echo "::error::Tests tried to reach hosts outside the runner:"
            cat "$PG1_NET_GUARD_LOG"
            exit 1
          fi

  # PG1's own projects (lib/autonomous/projects.mjs) put their code and its
  # test in lib/projects/<slug>/. They run here alone: the network blocked
  # (tests/ci/no-network.mjs), no secrets (this workflow references none),
  # a read-only token that checkout does not keep, and no npm install
  # scripts beyond the lockfile's.
  projects:
    name: project tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Project tests (network blocked, no secrets)
        env:
          PG1_NET_GUARD_LOG: ${{ runner.temp }}/network-violations.jsonl
        run: |
          shopt -s nullglob
          files=(lib/projects/*/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "No project tests."; exit 0; fi
          env -i PATH="$PATH" HOME="$HOME" PG1_NET_GUARD_LOG="$PG1_NET_GUARD_LOG" node --import ./tests/ci/no-network.mjs --test "${files[@]}"
      - name: Fail on any attempted network access
        if: always()
        env:
          PG1_NET_GUARD_LOG: ${{ runner.temp }}/network-violations.jsonl
        run: |
          if [ -s "$PG1_NET_GUARD_LOG" ]; then
            echo "::error::Project tests tried to reach hosts outside the runner:"
            cat "$PG1_NET_GUARD_LOG"
            exit 1
          fi

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium (version pinned by package-lock.json)
        run: npx playwright install --with-deps chromium
      - name: npm run test:browser (network blocked)
        env:
          NODE_OPTIONS: --import=./tests/ci/no-network.mjs
          PG1_NET_GUARD_LOG: ${{ runner.temp }}/network-violations.jsonl
        run: |
          set -o pipefail
          npm run test:browser | tee "$RUNNER_TEMP/browser.tap"
          # The browser tests skip themselves when Chromium is missing;
          # here that would be a silent pass, so treat it as a failure.
          grep -qx '# skipped 0' "$RUNNER_TEMP/browser.tap" || { echo "::error::Browser tests were skipped"; exit 1; }
      - name: Fail on any attempted network access
        if: always()
        env:
          PG1_NET_GUARD_LOG: ${{ runner.temp }}/network-violations.jsonl
        run: |
          if [ -s "$PG1_NET_GUARD_LOG" ]; then
            echo "::error::Tests tried to reach hosts outside the runner:"
            cat "$PG1_NET_GUARD_LOG"
            exit 1
          fi
      # Screenshots the browser tests regenerate, for looking at; never committed.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
