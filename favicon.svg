<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield/Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Circuit Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="6" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#cyanEmerald)" stroke-width="4" opacity="0.6" stroke-dasharray="40 20"/>
  
  <!-- Neural Nodes around Ring -->
  <circle cx="256" cy="46" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="466" cy="256" r="7" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="466" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="46" cy="256" r="7" fill="#10b981" filter="url(#glow)"/>

  <!-- Core Hex Shield -->
  <polygon points="256,90 396,170 396,342 256,422 116,342 116,170" 
           fill="#111827" 
           stroke="url(#cyanEmerald)" 
           stroke-width="8" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Inner Hexagon Accent -->
  <polygon points="256,125 365,188 365,324 256,387 147,324 147,188" 
           fill="none" 
           stroke="#1e293b" 
           stroke-width="3" 
           stroke-linejoin="round"/>

  <!-- Core Neural Pulse Center -->
  <circle cx="256" cy="256" r="65" fill="#0f172a" stroke="url(#cyanEmerald)" stroke-width="4"/>

  <!-- Lightning Bolt Sovereign Glyph -->
  <path d="M268 140 L195 260 L248 260 L232 372 L317 240 L264 240 Z" 
        fill="url(#boltGrad)" 
        filter="url(#intenseGlow)"/>

  <!-- Subtle PG1 Text Accents -->
  <text x="256" y="460" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#38bdf8" letter-spacing="6">PG1.AGENT</text>
</svg>