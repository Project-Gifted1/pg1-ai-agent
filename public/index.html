<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project-Gifted1™</title>
  <style>
    :root {
      --bg-color: #080808;
      --card-bg: #121212;
      --border-gold: #c5a059;
      --text-gold: #c5a059;
      --text-main: #e0e0e0;
      --input-bg: #181818;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-gold); background: var(--card-bg); z-index: 10; }
    header h1 { font-size: 16px; color: var(--text-gold); font-weight: 600; letter-spacing: 0.5px; }
    .header-controls { display: flex; gap: 8px; }
    .header-btn { background: transparent; border: 1px solid var(--border-gold); color: var(--text-gold); width: 32px; height: 32px; border-radius: 4px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .header-btn:active { background: rgba(197, 160, 89, 0.2); }
    
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    
    .message-bubble { background: var(--card-bg); border: 1px solid var(--border-gold); border-radius: 8px; padding: 12px 14px; max-width: 90%; align-self: flex-start; box-shadow: 0 2px 8px rgba(0,0,0,0.5); position: relative; }
    .message-bubble.user { align-self: flex-end; background: var(--input-bg); }
    .message-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    
    .message-actions { display: flex; gap: 12px; margin-top: 8px; font-size: 10px; color: var(--border-gold); letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; }
    .message-actions span:hover { text-decoration: underline; }

    .media-preview-container { margin-top: 12px; width: 100%; }
    .media-preview-container img, .media-preview-container video { width: 100%; border-radius: 6px; border: 1px solid var(--border-gold); background: #000; display: block; max-height: 400px; object-fit: contain; }
    
    .footer-panel { padding: 12px 16px; background: var(--card-bg); border-top: 1px solid var(--border-gold); display: flex; flex-direction: column; gap: 8px; }
    .toolbar-row { display: flex; justify-content: space-between; align-items: center; }
    
    .voice-group { display: flex; align-items: center; gap: 6px; }
    .voice-toggle { background: transparent; border: 1px solid var(--border-gold); color: var(--text-gold); padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600; letter-spacing: 0.5px; }
    .voice-select { background: var(--input-bg); border: 1px solid var(--border-gold); color: var(--text-gold); padding: 4px 6px; border-radius: 4px; font-size: 11px; outline: none; cursor: pointer; }

    .status-indicator { font-size: 11px; color: #888; letter-spacing: 0.5px; }
    
    .input-row { display: flex; gap: 8px; align-items: center; }
    .attach-btn { background: transparent; border: 1px solid var(--border-gold); color: var(--text-gold); border-radius: 6px; padding: 0 10px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }
    textarea { flex: 1; background: var(--input-bg); border: 1px solid var(--border-gold); border-radius: 6px; color: #fff; padding: 10px; font-size: 14px; resize: none; height: 44px; outline: none; }
    textarea::placeholder { color: #666; }
    .execute-btn { background: var(--border-gold); color: #000; border: none; font-weight: bold; padding: 0 16px; border-radius: 6px; height: 44px; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
    .execute-btn:active { opacity: 0.8; }
    
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Project-Gifted1™</h1>
    <div class="header-controls">
      <button class="header-btn" onclick="openVideoVaultModal()" title="Video Vault">📹</button>
      <button class="header-btn" onclick="exportChatPDF()" title="Export Transcript PDF">📄</button>
      <button class="header-btn" onclick="clearChat()" title="Clear Chat">🗑️</button>
      <button class="header-btn" onclick="triggerVaultSync()" title="Vault Sync">➕</button>
    </div>
  </header>

  <div id="chat-container">
    <div class="message-bubble" id="welcome-bubble">
      <div class="message-text">Greetings. New session initialized. PG1 Sovereign Agent operational.</div>
      <div class="message-actions">
        <span onclick="speakMessage('Greetings. New session initialized. PG1 Sovereign Agent operational.')">Speak</span>
        <span onclick="copyBubbleText(this)">Copy</span>
        <span onclick="deleteBubble(this)">Delete</span>
      </div>
    </div>
  </div>

  <div class="footer-panel">
    <div class="toolbar-row">
      <div class="voice-group">
        <button id="voice-btn" class="voice-toggle" onclick="toggleVoice()">VOICE: OFF</button>
        <select id="voice-profile-select" class="voice-select">
          <option value="christopher">Christopher</option>
          <option value="steffan">Steffan</option>
          <option value="ryan">Ryan</option>
          <option value="aria">Aria</option>
        </select>
      </div>
      <span id="sys-status" class="status-indicator">SYS: READY | STANDBY</span>
    </div>
    <div class="input-row">
      <label class="attach-btn" title="Attach File">
        📎
        <input type="file" id="file-input" onchange="handleFileSelect(event)">
      </label>
      <textarea id="prompt-input" placeholder="Input operational directive..." onkeydown="handleKey(event)"></textarea>
      <button class="execute-btn" onclick="submitDirective()">Execute</button>
    </div>
  </div>

  <script>
    let voiceActive = false;
    let attachedFilePayload = null;

    function toggleVoice() {
      voiceActive = !voiceActive;
      const btn = document.getElementById('voice-btn');
      btn.style.borderColor = voiceActive ? '#00ff66' : '#c5a059';
      btn.style.color = voiceActive ? '#00ff66' : '#c5a059';
      btn.textContent = voiceActive ? 'VOICE: ACTIVE' : 'VOICE: OFF';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitDirective();
      }
    }

    function clearChat() {
      document.getElementById('chat-container').innerHTML = `
        <div class="message-bubble">
          <div class="message-text">Matrix session cleared. Ready for new operational directives.</div>
          <div class="message-actions">
            <span onclick="speakMessage('Matrix session cleared.')">Speak</span>
            <span onclick="copyBubbleText(this)">Copy</span>
            <span onclick="deleteBubble(this)">Delete</span>
          </div>
        </div>`;
    }

    function exportChatPDF() {
      window.print();
    }

    function openVideoVaultModal() {
      alert("Video Vault & Media Stream Matrix initialized. Use /video [prompt] to stream 2-minute HD visual payloads.");
    }

    function triggerVaultSync() {
      const input = document.getElementById('prompt-input');
      input.value = "Sync all files from Supabase vault and display status.";
      submitDirective();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1];
        attachedFilePayload = {
          inlineData: {
            mimeType: file.type || 'application/octet-stream',
            data: base64Data
          }
        };
        document.getElementById('sys-status').textContent = `SYS: FILE ATTACHED (${file.name})`;
        document.getElementById('sys-status').style.color = '#00ff66';
      };
      reader.readAsDataURL(file);
    }

    async function speakMessage(text) {
      try {
        const voiceProfile = document.getElementById('voice-profile-select').value;
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, action: 'SPEAK', voice: voiceProfile })
        });
        const data = await response.json();
        if (data.audio) {
          const audio = new Audio(`data:${data.audioMimeType || 'audio/mp3'};base64,${data.audio}`);
          audio.play().catch(e => console.log('Audio playback prevented:', e));
        }
      } catch (err) {
        console.error('Speech synthesis error:', err);
      }
    }

    function copyBubbleText(el) {
      const text = el.closest('.message-bubble').querySelector('.message-text').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = el.textContent;
        el.textContent = 'Copied!';
        setTimeout(() => el.textContent = originalText, 1500);
      });
    }

    function deleteBubble(el) {
      const bubble = el.closest('.message-bubble');
      bubble.remove();
    }

    async function submitDirective() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (!text && !attachedFilePayload) return;

      const chatContainer = document.getElementById('chat-container');

      // Append Operator Message
      const userBubble = document.createElement('div');
      userBubble.className = 'message-bubble user';
      userBubble.innerHTML = `
        <div class="message-text">${escapeHTML(text || '[File Attached]')}</div>
        <div class="message-actions">
          <span onclick="copyBubbleText(this)">Copy</span>
          <span onclick="deleteBubble(this)">Delete</span>
        </div>`;
      chatContainer.appendChild(userBubble);
      
      input.value = '';
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // Append Agent Thinking Bubble
      const agentBubble = document.createElement('div');
      agentBubble.className = 'message-bubble';
      agentBubble.innerHTML = `<div class="message-text" style="color: #888;">Executing directive across sovereign core...</div>`;
      chatContainer.appendChild(agentBubble);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const voiceProfile = document.getElementById('voice-profile-select').value;
        const payload = {
          prompt: text,
          voice: voiceProfile
        };

        if (attachedFilePayload) {
          payload.file = attachedFilePayload;
          attachedFilePayload = null;
          document.getElementById('file-input').value = '';
          document.getElementById('sys-status').textContent = 'SYS: READY | STANDBY';
          document.getElementById('sys-status').style.color = '#888';
        }

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        
        let contentHtml = `<div class="message-text">${escapeHTML(data.reply || 'Execution complete.')}</div>`;

        // Native High-Resolution Image Renderer
        if (data.image) {
          contentHtml += `
            <div class="media-preview-container">
              <img src="${data.image}" alt="High-Spec Rendered Asset" />
            </div>`;
        }

        // Native HTML5 Video Stream Player (Supports full 2-minute playback)
        if (data.video) {
          contentHtml += `
            <div class="media-preview-container">
              <video controls preload="metadata" playsinline width="100%" src="${data.video}">
                Your browser does not support video playback.
              </video>
            </div>`;
        }

        contentHtml += `
          <div class="message-actions">
            <span onclick="speakMessage(${JSON.stringify(data.reply || '').replace(/"/g, '&quot;')})">Speak</span>
            <span onclick="copyBubbleText(this)">Copy</span>
            <span onclick="deleteBubble(this)">Delete</span>
          </div>`;

        agentBubble.innerHTML = contentHtml;

        // Play audio response automatically if voice toggle is active
        if (voiceActive && data.audio) {
          const audio = new Audio(`data:${data.audioMimeType || 'audio/mp3'};base64,${data.audio}`);
          audio.play().catch(e => console.log('Audio playback prevented:', e));
        }

      } catch (err) {
        agentBubble.innerHTML = `<div class="message-text" style="color: #ff4444;">Exception: ${escapeHTML(err.message)}</div>`;
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
