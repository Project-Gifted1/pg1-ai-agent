<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PG1 Sovereign Agent™ | Project-Gifted1™</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #030303;
      --bg-panel: #0A0A0A;
      --bg-bubble-bot: #111111;
      --bg-bubble-user: #1A1A1A;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.3);
      --text-main: #F4F4F5;
      --text-muted: #A1A1AA;
      --text-dim: #52525B;
      --accent-pure: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Executive Header */
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border: 1px solid var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 12px;
      color: var(--bg-base);
      background-color: var(--text-main);
      letter-spacing: -0.05em;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-block {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-main);
      border-radius: 50%;
      opacity: 0.8;
    }

    /* Chat Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
      scroll-behavior: smooth;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .msg-bubble {
      padding: 18px 22px;
      font-size: 14px;
      line-height: 1.7;
      border: 1px solid var(--border-subtle);
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 4px;
    }

    .msg-bubble.bot {
      background: var(--bg-bubble-bot);
      color: var(--text-main);
      border-left: 2px solid var(--text-dim);
    }

    .msg-bubble.user {
      background: var(--bg-bubble-user);
      color: var(--text-main);
      align-self: flex-end;
      max-width: 80%;
      border-right: 2px solid var(--text-main);
    }

    /* Footer / Input Area */
    footer {
      background: var(--bg-base);
      border-top: 1px solid var(--border-subtle);
      padding: 20px 24px calc(20px + env(safe-area-inset-bottom));
    }

    .footer-content {
      max-width: 840px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .action-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    
    .action-row::-webkit-scrollbar { display: none; }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 2px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover, .action-btn:active {
      border-color: var(--text-main);
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .input-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 12px;
      transition: border-color 0.3s;
    }

    .input-row:focus-within {
      border-color: var(--border-focus);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 4px 8px;
      resize: none;
      outline: none;
      max-height: 150px;
      height: 24px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: var(--text-dim);
    }

    .send-btn {
      width: 32px;
      height: 32px;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .send-btn:hover:not(:disabled), .send-btn:active:not(:disabled) {
      background: var(--text-main);
      border-color: var(--text-main);
    }

    .send-btn:hover:not(:disabled) svg {
      fill: var(--bg-base);
    }

    .send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 14px;
      height: 14px;
      fill: var(--text-main);
      transition: fill 0.2s;
    }

    .loading-text {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .loading-pulse {
      width: 4px;
      height: 4px;
      background-color: var(--text-main);
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-cluster">
      <div class="brand-mark">PG1</div>
      <div class="brand-meta">
        <span class="brand-title">PG1 Sovereign Agent™</span>
        <span class="brand-sub">Project-Gifted1™ Core</span>
      </div>
    </div>
    <div class="status-block">
      <div class="status-dot"></div>
      1,500 Nodes
    </div>
  </header>

  <main id="chat-stream">
    <div class="msg-wrapper">
      <div class="msg-meta">
        <span>SYS.INIT</span>
        <span>—</span>
        <span>Secure Connection Established</span>
      </div>
      <div class="msg-bubble bot">
Greetings. PG1 Sovereign Agent™ is operational and synchronized with the 1,500-node infrastructure under Project-Gifted1™. 

Submit your directive or select a command below to begin execution.
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <div class="action-row">
        <button class="action-btn" onclick="sendQuickPrompt('Generate system architecture status and node verification report.')">
          Status Report
        </button>
        <button class="action-btn" onclick="sendQuickPrompt('Review revenue strike deliverability and protocol parameters.')">
          Protocol Review
        </button>
        <button class="action-btn" onclick="sendQuickPrompt('Explain your full operational capabilities and sovereign mandate.')">
          Capabilities Matrix
        </button>
      </div>

      <div class="input-row">
        <textarea id="user-input" placeholder="Execute directive or query agent..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" aria-label="Transmit">
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <script>
    const chatStream = document.getElementById('chat-stream');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    userInput.addEventListener('input', function() {
      this.style.height = '24px';
      this.style.height = (this.scrollHeight < 150 ? this.scrollHeight : 150) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    function sendQuickPrompt(text) {
      userInput.value = text;
      sendMessage();
    }

    async function sendMessage() {
      const prompt = userInput.value.trim();
      if (!prompt) return;

      userInput.value = '';
      userInput.style.height = '24px';
      
      appendUserMessage(prompt);
      sendBtn.disabled = true;

      const loadingContainer = appendLoading();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            prompt: prompt,
            userMessage: prompt,
            message: prompt
          })
        });

        const data = await res.json();
        loadingContainer.remove();

        if (!res.ok) {
          appendBotMessage(`System Error: ${data.error || 'Execution interrupted'}`, 'ERR.LOG');
        } else {
          appendBotMessage(data.reply || 'Execution complete.', 'EXEC.OUT');
        }
      } catch (err) {
        loadingContainer.remove();
        appendBotMessage(`Network Error: ${err.message}`, 'SYS.FAULT');
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    function appendUserMessage(text) {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper';
      
      const msg = document.createElement('div');
      msg.className = 'msg-bubble user';
      msg.textContent = text;
      
      wrapper.appendChild(msg);
      chatStream.appendChild(wrapper);
      scrollToBottom();
    }

    function appendBotMessage(text, statusText = 'EXEC.OUT') {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper';
      
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `<span>PG1</span><span>—</span><span>${statusText}</span>`;
      
      const msg = document.createElement('div');
      msg.className = 'msg-bubble bot';
      msg.textContent = text;
      
      wrapper.appendChild(meta);
      wrapper.appendChild(msg);
      chatStream.appendChild(wrapper);
      scrollToBottom();
    }

    function appendLoading() {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper';
      
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `<span>PG1</span><span>—</span><span>PROCESSING DIRECTIVE</span>`;
      
      const msg = document.createElement('div');
      msg.className = 'msg-bubble bot';
      msg.innerHTML = '<div class="loading-text"><div class="loading-pulse"></div> AWAITING RESPONSE</div>';
      
      wrapper.appendChild(meta);
      wrapper.appendChild(msg);
      chatStream.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function scrollToBottom() {
      chatStream.scrollTop = chatStream.scrollHeight;
    }
  </script>
</body>
</html>
