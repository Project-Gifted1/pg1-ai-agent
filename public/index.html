<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project-Gifted1™</title>
  <style>
    :root {
      --bg-color: #080808;
      --card-bg: #121212;
      --border-gold: #c5a059;
      --text-gold: #c5a059;
      --text-main: #e0e0e0;
      --input-bg: #181818;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-gold); background: var(--card-bg); }
    header h1 { font-size: 16px; color: var(--text-gold); font-weight: 600; letter-spacing: 0.5px; }
    .header-controls { display: flex; gap: 8px; }
    .header-btn { background: transparent; border: 1px solid var(--border-gold); color: var(--text-gold); padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    
    .message-bubble { background: var(--card-bg); border: 1px solid var(--border-gold); border-radius: 8px; padding: 12px 14px; max-width: 90%; align-self: flex-start; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .message-bubble.user { align-self: flex-end; background: var(--input-bg); }
    .message-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    
    .media-preview-container { margin-top: 10px; width: 100%; }
    .media-preview-container img, .media-preview-container video { width: 100%; border-radius: 6px; border: 1px solid var(--border-gold); background: #000; display: block; }
    
    .footer-panel { padding: 12px 16px; background: var(--card-bg); border-top: 1px solid var(--border-gold); display: flex; flex-direction: column; gap: 8px; }
    .toolbar-row { display: flex; justify-content: space-between; align-items: center; }
    .voice-toggle { background: transparent; border: 1px solid var(--border-gold); color: var(--text-gold); padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .status-indicator { font-size: 11px; color: #888; letter-spacing: 0.5px; }
    
    .input-row { display: flex; gap: 8px; }
    textarea { flex: 1; background: var(--input-bg); border: 1px solid var(--border-gold); border-radius: 6px; color: #fff; padding: 10px; font-size: 14px; resize: none; height: 44px; outline: none; }
    textarea::placeholder { color: #666; }
    .execute-btn { background: var(--border-gold); color: #000; border: none; font-weight: bold; padding: 0 16px; border-radius: 6px; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
    .execute-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <header>
    <h1>Project-Gifted1™</h1>
    <div class="header-controls">
      <button class="header-btn" onclick="clearChat()">🗑️</button>
      <button class="header-btn" onclick="exportChat()">📄</button>
    </div>
  </header>

  <div id="chat-container">
    <div class="message-bubble">
      <div class="message-text">Greetings. New session initialized. PG1 Sovereign Agent operational.</div>
    </div>
  </div>

  <div class="footer-panel">
    <div class="toolbar-row">
      <button id="voice-btn" class="voice-toggle" onclick="toggleVoice()">VOICE: OFF</button>
      <span class="status-indicator">SYS: READY | STANDBY</span>
    </div>
    <div class="input-row">
      <textarea id="prompt-input" placeholder="Input operational directive..." onkeydown="handleKey(event)"></textarea>
      <button class="execute-btn" onclick="submitDirective()">Execute</button>
    </div>
  </div>

  <script>
    let voiceActive = false;

    function toggleVoice() {
      voiceActive = !voiceActive;
      const btn = document.getElementById('voice-btn');
      btn.style.borderColor = voiceActive ? '#00ff66' : '#c5a059';
      btn.style.color = voiceActive ? '#00ff66' : '#c5a059';
      btn.textContent = voiceActive ? 'VOICE: ACTIVE' : 'VOICE: OFF';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitDirective();
      }
    }

    function clearChat() {
      document.getElementById('chat-container').innerHTML = '';
    }

    function exportChat() {
      window.print();
    }

    async function submitDirective() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (!text) return;

      const chatContainer = document.getElementById('chat-container');

      const userBubble = document.createElement('div');
      userBubble.className = 'message-bubble user';
      userBubble.innerHTML = `<div class="message-text">${escapeHTML(text)}</div>`;
      chatContainer.appendChild(userBubble);
      
      input.value = '';
      chatContainer.scrollTop = chatContainer.scrollHeight;

      const agentBubble = document.createElement('div');
      agentBubble.className = 'message-bubble';
      agentBubble.innerHTML = `<div class="message-text" style="color: #888;">Executing directive...</div>`;
      chatContainer.appendChild(agentBubble);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, voice: voiceActive ? 'christopher' : 'off' })
        });

        const data = await response.json();
        
        let contentHtml = `<div class="message-text">${escapeHTML(data.reply || 'Execution complete.')}</div>`;

        if (data.image) {
          contentHtml += `
            <div class="media-preview-container">
              <img src="${data.image}" alt="Generated Asset" />
            </div>`;
        }

        if (data.video) {
          contentHtml += `
            <div class="media-preview-container">
              <video controls preload="metadata" playsinline width="100%" src="${data.video}">
                Your browser does not support video playback.
              </video>
            </div>`;
        }

        agentBubble.innerHTML = contentHtml;

        if (voiceActive && data.audio) {
          const audio = new Audio(`data:${data.audioMimeType || 'audio/mp3'};base64,${data.audio}`);
          audio.play().catch(e => console.log('Audio playback prevented:', e));
        }

      } catch (err) {
        agentBubble.innerHTML = `<div class="message-text" style="color: #ff4444;">Exception: ${escapeHTML(err.message)}</div>`;
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
