<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PG1 Sovereign Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #080B11; color: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 18px 20px; background-color: #0D121D; border-bottom: 1px solid #1E293B; display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 20px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
    .status-pill { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; padding: 3px 8px; background: rgba(16, 185, 129, 0.12); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; font-weight: 600; }
    
    main { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }
    .bubble-wrapper { display: flex; flex-direction: column; gap: 6px; }
    .bubble { background-color: #111726; border: 1px solid #1E293B; border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.6; color: #CBD5E1; word-wrap: break-word; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); }
    .bubble.user { align-self: flex-end; background: linear-gradient(135deg, #1E293B, #172033); color: #F8FAFC; border: 1px solid #334155; max-width: 85%; }
    .bubble strong { color: #FFFFFF; font-weight: 600; }
    .bubble pre { background: #080B11; padding: 12px; border-radius: 8px; margin: 10px 0; overflow-x: auto; border: 1px solid #1E293B; }
    .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; color: #60A5FA; }
    .bubble p { margin-bottom: 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble img { max-width: 100%; border-radius: 8px; margin: 12px 0; border: 1px solid #1E293B; display: block; }

    /* Elegant Sovereign Consent Gate Card */
    .consent-card {
      margin-top: 14px;
      background: linear-gradient(180deg, #141C2E 0%, #0D1322 100%);
      border: 1px solid #2B3954;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .consent-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #3B82F6, #10B981, #6366F1);
    }
    .consent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1E293B;
      padding-bottom: 8px;
    }
    .consent-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .consent-trust-badge {
      font-size: 11px;
      font-weight: 600;
      color: #34D399;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.25);
      padding: 2px 8px;
      border-radius: 20px;
    }
    .consent-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .btn-consent {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      outline: none;
    }
    .btn-accept {
      background: linear-gradient(180deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      border: 1px solid #059669;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
    }
    .btn-accept:active { transform: scale(0.98); opacity: 0.9; }
    .btn-decline {
      background: rgba(239, 68, 68, 0.08);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .btn-decline:active { transform: scale(0.98); background: rgba(239, 68, 68, 0.15); }

    /* Audio / Bottom Dock */
    .voice-panel { background-color: #0D121D; border-top: 1px solid #1E293B; border-radius: 16px 16px 0 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .voice-toggle-btn { background-color: #2563EB; color: #FFFFFF; border: none; border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; align-self: flex-start; }
    .voice-toggle-btn.active { background-color: #10B981; }
    .voice-stats { font-size: 11px; color: #64748B; font-family: monospace; }
    
    .input-area { background-color: #080B11; padding: 12px 16px 20px 16px; display: flex; gap: 8px; }
    .input-box { flex: 1; background-color: #111726; border: 1px solid #1E293B; border-radius: 8px; color: #F8FAFC; font-size: 14px; padding: 10px 12px; resize: none; outline: none; font-family: inherit; }
    .input-box:focus { border-color: #3B82F6; }
    .action-buttons { display: flex; flex-direction: column; gap: 6px; }
    .send-btn { background: #2563EB; color: white; border: none; border-radius: 8px; padding: 0 16px; font-weight: 600; font-size: 14px; cursor: pointer; flex: 1; }
    .send-btn:disabled { opacity: 0.5; }
    .mic-btn { background-color: #1E293B; border: 1px solid #334155; color: white; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .mic-btn.recording { background-color: #EF4444; border-color: #EF4444; }
  </style>
</head>
<body>
  <header>
    <div class="header-title">PG1 Sovereign Agent</div>
    <div class="status-pill">Active Node</div>
  </header>

  <main id="chat-stream">
    <div class="bubble-wrapper">
      <div class="bubble bot">Greetings. PG1 Sovereign Agent is operational and secured. Repository telemetry online.</div>
    </div>
  </main>

  <div class="voice-panel">
    <button id="voice-toggle" class="voice-toggle-btn" onclick="toggleVoice()">🎙️ Enable Voice</button>
    <div id="voice-stats" class="voice-stats">Voice: Disabled | System TTS: Ready | Telemetry: Encrypted</div>
  </div>

  <div class="input-area">
    <textarea id="user-input" class="input-box" rows="2" placeholder="Send directive to PG1..."></textarea>
    <div class="action-buttons">
      <button id="send-btn" class="send-btn">Send</button>
      <button id="mic-btn" class="mic-btn">🎙️</button>
    </div>
  </div>

  <script>
    const chatStream = document.getElementById('chat-stream');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const voiceToggleBtn = document.getElementById('voice-toggle');
    const voiceStats = document.getElementById('voice-stats');
    let voiceEnabled = false;

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      if (voiceEnabled) {
        voiceToggleBtn.classList.add('active'); voiceToggleBtn.innerText = "🎙️ Voice Active";
        voiceStats.innerText = "Voice: Enabled | System TTS: Active | Telemetry: Encrypted";
        if ('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      } else {
        voiceToggleBtn.classList.remove('active'); voiceToggleBtn.innerText = "🎙️ Enable Voice";
        voiceStats.innerText = "Voice: Disabled | System TTS: Ready | Telemetry: Encrypted";
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    let recognition;
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.onstart = () => micBtn.classList.add('recording');
      recognition.onend = () => micBtn.classList.remove('recording');
      recognition.onresult = (e) => userInput.value += (userInput.value ? ' ' : '') + e.results[0][0].transcript;
      micBtn.addEventListener('click', () => micBtn.classList.contains('recording') ? recognition.stop() : recognition.start());
    }

    function speakText(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const plainText = text.replace(/[*_#`]/g, '').replace(/!\[.*?\]\(.*?\)/g, '').replace(/\[CONSENT_REQUIRED\]/g, ''); 
      const utterance = new SpeechSynthesisUtterance(plainText);
      utterance.rate = 1.05; window.speechSynthesis.speak(utterance);
    }

    function parseMarkdown(text) {
      let html = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      html = html.replace(/!\[([^\]]*)\]\((.*?)\)/g, '<img src="$2" alt="$1" />');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      
      // Render the sophisticated Consent Gate Notification Card
      if (html.includes('[CONSENT_REQUIRED]')) {
        html = html.replace('[CONSENT_REQUIRED]', '');
        html += `
          <div class="consent-card">
            <div class="consent-header">
              <span class="consent-title">🛡️ Authorization Required</span>
              <span class="consent-trust-badge">Pre-Flight Verified</span>
            </div>
            <div class="consent-actions">
              <button class="btn-consent btn-accept" onclick="submitConsent('ACCEPT')">
                ✓ Authorize Execution
              </button>
              <button class="btn-consent btn-decline" onclick="submitConsent('DECLINE')">
                ✕ Dismiss Action
              </button>
            </div>
          </div>
        `;
      }
      
      html = html.split('\n').map(line => line.trim() ? (line.match(/^(<pre|<code|<img|<div|<button|<span|<header)/) ? line : `<p>${line}</p>`) : '').join('\n');
      return html;
    }

    window.submitConsent = function(decision) {
      userInput.value = `[SYSTEM_OVERRIDE]: User has selected to ${decision} the proposed action.`;
      sendMessage();
    };

    async function sendMessage() {
      const prompt = userInput.value.trim();
      if (!prompt) return;
      userInput.value = ''; 
      appendUserMessage(prompt.replace('[SYSTEM_OVERRIDE]: ', '')); 
      sendBtn.disabled = true;
      
      const id = 'msg-' + Date.now();
      const wrapper = document.createElement('div'); 
      wrapper.className = 'bubble-wrapper'; 
      wrapper.id = id;
      wrapper.innerHTML = `<div class="bubble bot" style="opacity:0.65">Analyzing repository telemetry...</div>`;
      chatStream.appendChild(wrapper); 
      scrollToBottom();

      try {
        const res = await fetch(`/api/chat?t=${Date.now()}`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache'
          },
          body: JSON.stringify({ prompt: prompt, userMessage: prompt, message: prompt })
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const reply = data.reply || 'Execution complete.';
        wrapper.querySelector('.bubble').style.opacity = '1';
        wrapper.querySelector('.bubble').innerHTML = parseMarkdown(reply);
        scrollToBottom(); 
        speakText(reply);
      } catch (err) {
        wrapper.querySelector('.bubble').style.opacity = '1';
        wrapper.querySelector('.bubble').innerText = `Telemetry Alert: ${err.message}.`;
      } finally { 
        sendBtn.disabled = false; 
      }
    }

    function appendUserMessage(text) {
      const wrapper = document.createElement('div'); 
      wrapper.className = 'bubble-wrapper';
      wrapper.innerHTML = `<div class="bubble user">${text}</div>`;
      chatStream.appendChild(wrapper); 
      scrollToBottom();
    }
    
    function scrollToBottom() { 
      chatStream.scrollTop = chatStream.scrollHeight; 
    }
    
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => { 
      if (e.key === 'Enter' && !e.shiftKey) { 
        e.preventDefault(); 
        sendMessage(); 
      } 
    });
  </script>
</body>
</html>
