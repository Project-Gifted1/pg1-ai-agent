<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PG1 Sovereign Agent</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #12141c;
      --border: #1f2430;
      --text: #e2e8f0;
      --accent: #3b82f6;
      --accent-gemini: #10b981;
      --accent-router: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
    }
    .badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent);
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .message {
      padding: 14px 18px;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .message.user {
      background: #1e293b;
      align-self: flex-end;
      max-width: 80%;
    }
    .message.agent {
      background: var(--card);
      border: 1px solid var(--border);
      align-self: flex-start;
      max-width: 90%;
    }
    .provider-tag {
      font-size: 11px;
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .tag-gemini { color: var(--accent-gemini); }
    .tag-openrouter { color: var(--accent-router); }
    .voice-player {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .voice-status {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    #voice-output {
      width: 100%;
      margin-top: 10px;
    }
    footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--card);
      display: flex;
      gap: 12px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto 16px auto;
      border-radius: 10px;
    }
    textarea {
      flex: 1;
      background: #0d0e15;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      resize: none;
      height: 48px;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h2>PG1 Sovereign Agent</h2>
    <span class="badge">Dynamic Routing: Gemini Pro &bull; DeepSeek</span>
  </header>
  <main id="chat"></main>
  <section class="voice-player">
    <button id="play-voice-btn" type="button">🎙️ Enable Voice</button>
    <div class="voice-status" id="voice-status">
      Voice: Disabled | Polly: Ready | Free Tier: 5M chars/month
    </div>
    <audio id="voice-output" controls></audio>
  </section>
  <footer>
    <textarea id="prompt" placeholder="Ask PG1 anything (code, analysis, or general query)..."></textarea>
    <button id="sendBtn">Send</button>
  </footer>

  <script src="/voice-player.js"></script>
  <script>
    const chat = document.getElementById('chat');
    const promptInput = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const playVoiceBtn = document.getElementById('play-voice-btn');
    const voiceStatus = document.getElementById('voice-status');
    window.PG1_VOICE_ENABLED = false;

    playVoiceBtn.addEventListener('click', () => {
      window.PG1_VOICE_ENABLED = !window.PG1_VOICE_ENABLED;
      playVoiceBtn.innerText = window.PG1_VOICE_ENABLED ? '🎙️ Voice Enabled' : '🎙️ Enable Voice';
      voiceStatus.innerText = window.PG1_VOICE_ENABLED
        ? 'Voice: Enabled | Polly: Connected | Free Tier: 5M chars/month'
        : 'Voice: Disabled | Polly: Ready | Free Tier: 5M chars/month';
    });

    function appendMessage(role, text, provider, model) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      if (provider) {
        const tag = document.createElement('div');
        tag.className = `provider-tag tag-${provider}`;
        tag.innerText = `[${provider.toUpperCase()}] ${model || ''}`;
        msg.appendChild(tag);
      }
      const textSpan = document.createElement('span');
      textSpan.innerText = text;
      msg.appendChild(textSpan);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    // Step 2 Standard Agent Dispatcher
    async function sendToAgent(userPrompt) {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: userPrompt })
      });
      const data = await response.json();
      if (!response.ok || data.error) {
        throw new Error(data.error || `HTTP ${response.status}`);
      }
      return data;
    }

    async function handleSend() {
      const userPrompt = promptInput.value.trim();
      if (!userPrompt) return;

      appendMessage('user', userPrompt);
      promptInput.value = '';
      sendBtn.disabled = true;

      try {
        const data = await sendToAgent(userPrompt);
        appendMessage('agent', data.reply, data.provider, data.model);
        if (window.PG1_VOICE_ENABLED && window.PG1Voice) {
          try {
            await window.PG1Voice.playVoice(data.reply, 'neutral');
          } catch (voiceErr) {
            console.error('Voice playback failed:', voiceErr);
          }
        }
      } catch (err) {
        appendMessage('agent', 'Error: ' + err.message);
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', handleSend);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
</html>
