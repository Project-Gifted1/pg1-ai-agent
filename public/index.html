<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Project-Gifted1™</title>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg-deep: #000000;
      --bg-surface: #040404;
      --bg-glass: rgba(0, 0, 0, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(234, 179, 8, 0.5);
      --accent-gold: #EAB308;
      --accent-glow: rgba(234, 179, 8, 0.25);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: var(--bg-deep); 
      color: var(--text-main); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      height: 100dvh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      position: relative; 
    }

    #auth-gate { position: fixed; inset: 0; background: #000000; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .auth-card { background: var(--bg-surface); border: 1px solid var(--accent-gold); border-radius: 14px; width: 100%; max-width: 360px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 0 30px rgba(234, 179, 8, 0.2); }
    .auth-title { font-size: 14px; font-weight: 700; font-family: var(--font-mono); color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    .auth-input { background: #000; border: 1px solid rgba(234, 179, 8, 0.4); border-radius: 8px; color: var(--text-main); padding: 12px; font-size: 14px; outline: none; font-family: var(--font-mono); }
    .auth-input:focus { border-color: var(--accent-gold); box-shadow: 0 0 12px var(--accent-glow); }
    .auth-btn { background: var(--accent-gold); color: #000; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-family: var(--font-mono); text-transform: uppercase; cursor: pointer; box-shadow: 0 2px 10px var(--accent-glow); transition: all 0.2s; }
    .auth-error { color: #EF4444; font-size: 11px; font-family: var(--font-mono); text-align: center; display: none; }

    .hud-ambient-bg { position: fixed; top: -20%; left: 50%; transform: translateX(-50%); width: 600px; height: 400px; background: radial-gradient(circle, rgba(234, 179, 8, 0.07) 0%, transparent 70%); z-index: 0; pointer-events: none; }
    @keyframes hudPulse { 0% { box-shadow: inset 0 0 15px rgba(234, 179, 8, 0.05); border: 1px solid rgba(234, 179, 8, 0.05); } 50% { box-shadow: inset 0 0 35px rgba(234, 179, 8, 0.15); border: 1px solid rgba(234, 179, 8, 0.25); } 100% { box-shadow: inset 0 0 15px rgba(234, 179, 8, 0.05); border: 1px solid rgba(234, 179, 8, 0.05); } }
    .hud-border-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 1; animation: hudPulse 6s ease-in-out infinite; }
    
    header { padding: 12px 16px; background-color: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(234, 179, 8, 0.3); display: flex; align-items: center; justify-content: space-between; z-index: 10; position: relative; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 1px 15px rgba(234, 179, 8, 0.15); }
    .header-title-group { display: flex; align-items: center; gap: 8px; }
    .header-title { font-size: 16px; font-weight: 800; letter-spacing: -0.2px; background: linear-gradient(90deg, #FFFFFF 0%, #FDE047 50%, #FFFFFF 100%); background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text; animation: shineSweep 4s linear infinite; cursor: pointer; transition: transform 0.15s; }
    .header-title:active { transform: scale(0.96); }
    @keyframes shineSweep { to { background-position: 200% center; } }
    .trademark-symbol { font-size: 10px; color: var(--accent-gold); vertical-align: super; margin-left: 1px; animation: trademarkPulse 2.5s ease-in-out infinite; text-shadow: 0 0 8px var(--accent-glow); }
    @keyframes trademarkPulse { 0% { opacity: 0.7; text-shadow: 0 0 4px rgba(234, 179, 8, 0.4); } 50% { opacity: 1; text-shadow: 0 0 12px rgba(234, 179, 8, 0.8); } 100% { opacity: 0.7; text-shadow: 0 0 4px rgba(234, 179, 8, 0.4); } }
    
    .header-actions { display: flex; gap: 6px; align-items: center; }
    @keyframes ambientButtonGlow { 0% { box-shadow: 0 0 5px rgba(234, 179, 8, 0.1); border-color: rgba(234, 179, 8, 0.2); color: #94A3B8; } 50% { box-shadow: 0 0 12px rgba(234, 179, 8, 0.3); border-color: rgba(234, 179, 8, 0.5); color: #FDE047; } 100% { box-shadow: 0 0 5px rgba(234, 179, 8, 0.1); border-color: rgba(234, 179, 8, 0.2); color: #94A3B8; } }
    .icon-btn { background: #000000; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1); animation: ambientButtonGlow 5s ease-in-out infinite; }
    .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: inherit; }
    .icon-btn:hover { background: rgba(234, 179, 8, 0.15); color: #FFF; box-shadow: 0 0 15px var(--accent-glow) !important; border-color: var(--accent-gold) !important; animation: none; }
    .icon-btn:active { transform: scale(0.90); }

    main { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; z-index: 2; position: relative; scroll-behavior: smooth; }
    @keyframes messageSlide { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .bubble-wrapper { display: flex; flex-direction: column; gap: 4px; animation: messageSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; width: 100%; }
    .bubble-container { position: relative; display: flex; flex-direction: column; max-width: 88%; }
    .bubble-container.user { align-self: flex-end; }
    .bubble-container.bot { align-self: flex-start; max-width: 92%; }

    @keyframes botGoldGlow { 0% { border-color: rgba(234, 179, 8, 0.3); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 8px rgba(234, 179, 8, 0.15); } 50% { border-color: rgba(234, 179, 8, 0.7); box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7), 0 0 22px rgba(234, 179, 8, 0.4); } 100% { border-color: rgba(234, 179, 8, 0.3); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 8px rgba(234, 179, 8, 0.15); } }
    .bubble { background-color: #000000; border-radius: 10px; padding: 14px 16px; font-size: 13.5px; line-height: 1.6; color: #E2E8F0; word-wrap: break-word; backdrop-filter: blur(8px); }
    .bubble-container.bot .bubble { animation: botGoldGlow 4s ease-in-out infinite; border: 1px solid; }
    .bubble-container.user .bubble { background-color: #0A0800; color: var(--text-main); border: 1px solid rgba(234, 179, 8, 0.5); box-shadow: 0 4px 20px rgba(234, 179, 8, 0.2); }
    .bubble strong { color: #FFFFFF; font-weight: 600; }
    .bubble pre { background: var(--bg-surface); padding: 12px; border-radius: 6px; margin: 10px 0; overflow-x: auto; border: 1px solid rgba(234, 179, 8, 0.3); }
    .bubble code { font-family: var(--font-mono); font-size: 12px; color: #FDE047; }
    .bubble p { margin-bottom: 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble img, .bubble video { max-width: 100%; border-radius: 6px; margin: 10px 0; border: 1px solid rgba(234, 179, 8, 0.4); display: block; }

    .message-meta { display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; color: var(--text-muted); padding: 2px 4px; margin-top: 2px; font-family: var(--font-mono); }
    .message-tools { display: flex; gap: 10px; opacity: 0.6; transition: opacity 0.2s ease; }
    .bubble-container:hover .message-tools { opacity: 1; }
    .tool-action { background: none; border: none; color: var(--text-muted); font-size: 9.5px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.8px; font-family: var(--font-mono); transition: color 0.15s; display: flex; align-items: center; gap: 4px; }
    .tool-action:hover { color: var(--accent-gold); text-shadow: 0 0 5px var(--accent-glow); }
    .edit-input { width: 100%; background: #000000; border: 1px solid var(--border-active); color: var(--text-main); padding: 10px; border-radius: 8px; font-family: inherit; font-size: 13px; resize: none; outline: none; margin-top: 4px; box-shadow: 0 0 15px var(--accent-glow); }

    .consent-card { margin-top: 12px; background-color: #000000; border: 1px solid rgba(234, 179, 8, 0.4); border-left: 3px solid var(--accent-gold); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 15px rgba(234, 179, 8, 0.15); }
    .consent-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(234, 179, 8, 0.3); padding-bottom: 8px; }
    .consent-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-family: var(--font-mono); }
    .consent-actions { display: flex; gap: 10px; }
    .btn-consent { flex: 1; padding: 8px 12px; border-radius: 6px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: all 0.2s ease; border: none; font-family: var(--font-mono); }
    .btn-accept { background-color: var(--accent-gold); color: #000000; box-shadow: 0 2px 10px var(--accent-glow); }
    .btn-accept:active { background-color: #CA8A04; transform: scale(0.98); }

    .video-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.98); backdrop-filter: blur(16px); display: none; flex-direction: column; z-index: 200; opacity: 0; transition: opacity 0.25s ease; }
    .video-modal.active { display: flex; opacity: 1; }
    .video-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(234, 179, 8, 0.4); background: var(--bg-glass); box-shadow: 0 0 25px rgba(234, 179, 8, 0.15); }
    .video-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-mono); color: var(--accent-gold); display: flex; align-items: center; gap: 8px; text-shadow: 0 0 8px var(--accent-glow); }
    .live-dot { width: 8px; height: 8px; background: #EF4444; border-radius: 50%; box-shadow: 0 0 8px #EF4444; animation: pulseRed 1.5s infinite; }
    .video-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
    #live-video-stream { width: 100%; height: 100%; object-fit: cover; }
    .video-controls { padding: 20px; display: flex; justify-content: center; gap: 16px; background: var(--bg-glass); border-top: 1px solid rgba(234, 179, 8, 0.4); }

    .voice-panel { background: var(--bg-glass); backdrop-filter: blur(16px); border-top: 1px solid rgba(234, 179, 8, 0.3); padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; z-index: 10; position: relative; }
    .voice-panel-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .voice-controls-group { display: flex; align-items: center; gap: 8px; }
    .voice-toggle-btn { background-color: #000000; color: var(--text-muted); border: 1px solid rgba(234, 179, 8, 0.3); border-radius: 6px; padding: 6px 12px; font-size: 9.5px; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: all 0.2s; font-family: var(--font-mono); animation: ambientButtonGlow 5s infinite; }
    .voice-toggle-btn.active { background-color: var(--accent-gold); color: #000000; border-color: #FACC15; box-shadow: 0 0 15px var(--accent-glow); font-weight: 700; animation: none; }
    .voice-select { background-color: #000000; color: var(--text-main); border: 1px solid rgba(234, 179, 8, 0.3); border-radius: 6px; padding: 6px 10px; font-size: 9.5px; font-weight: 500; outline: none; cursor: pointer; font-family: var(--font-mono); animation: ambientButtonGlow 5s infinite reverse; }

    .input-area { background-color: var(--bg-glass); backdrop-filter: blur(16px); padding: 10px 16px 16px 16px; display: flex; gap: 8px; align-items: stretch; border-top: 1px solid rgba(234, 179, 8, 0.3); z-index: 10; position: relative; box-shadow: 0 -4px 20px rgba(0,0,0,0.8); }
    .input-box { flex: 1; background-color: #000000; border: 1px solid rgba(234, 179, 8, 0.4); border-radius: 10px; color: var(--text-main); font-size: 13.5px; padding: 12px 14px; resize: none; outline: none; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
    .input-box:focus { border-color: var(--accent-gold); box-shadow: 0 0 18px var(--accent-glow); }
    .action-buttons { display: flex; flex-direction: column; gap: 6px; }
    .send-btn, .attach-btn, .mic-btn { background: #000000; border: 1px solid rgba(234, 179, 8, 0.3); color: #94A3B8; border-radius: 9px; cursor: pointer; transition: all 0.2s; font-family: var(--font-mono); animation: ambientButtonGlow 4s infinite alternate; }
    .send-btn { padding: 0 16px; font-weight: 600; font-size: 11px; flex: 1; text-transform: uppercase; }
    .attach-btn, .mic-btn { width: 40px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .send-btn:hover, .attach-btn:hover, .mic-btn:hover { border-color: var(--accent-gold); color: #FFF; background: rgba(234, 179, 8, 0.2); box-shadow: 0 0 15px var(--accent-glow) !important; animation: none; }
    .mic-btn.recording { background-color: #7F1D1D !important; color: #FECACA !important; border-color: #991B1B !important; animation: pulseRed 1.5s infinite !important; }
    @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(127, 29, 29, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(127, 29, 29, 0); } 100% { box-shadow: 0 0 0 0 rgba(127, 29, 29, 0); } }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.25s ease; }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-card { background: #000000; border: 1px solid var(--accent-gold); border-radius: 14px; width: 90%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 15px 50px rgba(234,179,8,0.25); }
    .thread-item { background: #050505; border: 1px solid rgba(234, 179, 8, 0.3); border-radius: 9px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .thread-item.active-thread { border-color: var(--accent-gold); box-shadow: 0 0 15px var(--accent-glow); background: rgba(234, 179, 8, 0.1); }
    .file-preview { display: none; background-color: #000000; border: 1px solid var(--accent-gold); border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; font-size: 11px; color: #FDE047; align-items: center; justify-content: space-between; font-family: var(--font-mono); box-shadow: 0 0 10px var(--accent-glow); }
    .file-preview.active { display: flex; }
  </style>
</head>
<body>
  <div id="auth-gate">
    <div class="auth-card">
      <div class="auth-title">Project-Gifted1 Security Gate</div>
      <input type="text" id="gate-user" class="auth-input" placeholder="Enter Username..." autocomplete="off" />
      <input type="password" id="gate-pass" class="auth-input" placeholder="Enter Password..." autocomplete="current-password" />
      <button type="button" id="auth-btn-submit" class="auth-btn">Authenticate</button>
      <div id="gate-error" class="auth-error">Access Denied: Invalid Credentials.</div>
    </div>
  </div>

  <script>
    document.getElementById('auth-btn-submit').addEventListener('click', async function() {
      const u = document.getElementById('gate-user').value.trim();
      const p = document.getElementById('gate-pass').value.trim();
      const errDiv = document.getElementById('gate-error');
      const authBtn = document.getElementById('auth-btn-submit');
      
      authBtn.innerText = 'VERIFYING...';
      errDiv.style.display = 'none';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: 'AUTH_VERIFY', user: u, pass: p })
        });
        
        if (!res.ok) throw new Error(`Gateway Error: HTTP ${res.status}`);
        
        const data = await res.json();
        
        if (data.authenticated) {
          sessionStorage.setItem('pg1_auth', 'true');
          document.getElementById('auth-gate').style.display = 'none';
        } else {
          errDiv.innerText = 'Access Denied: Invalid Credentials.';
          errDiv.style.display = 'block';
        }
      } catch (err) {
        errDiv.innerText = err.message;
        errDiv.style.display = 'block';
      } finally {
        authBtn.innerText = 'AUTHENTICATE';
      }
    });

    if (sessionStorage.getItem('pg1_auth') === 'true') {
      document.getElementById('auth-gate').style.display = 'none';
    }
  </script>

  <script>
    // System Variables
    const chatStream = document.getElementById('chat-stream');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const voiceToggleBtn = document.getElementById('voice-toggle');
    const voiceStats = document.getElementById('voice-stats');
    const voiceSelect = document.getElementById('voice-select');
    
    let voiceEnabled = false;
    let currentAttachment = null;
    let activeStream = null;
    let useFrontCamera = false;

    // Interface Core Tools
    function triggerHaptic(duration = 15) { if ('vibrate' in navigator) { try { navigator.vibrate(duration); } catch (e) {} } }
    
    async function openLiveVideo() { triggerHaptic(25); document.getElementById('video-modal').classList.add('active'); await startCameraStream(); }
    async function startCameraStream() { try { if (activeStream) { activeStream.getTracks().forEach(track => track.stop()); } const constraints = { video: { facingMode: useFrontCamera ? 'user' : 'environment' }, audio: true }; activeStream = await navigator.mediaDevices.getUserMedia(constraints); document.getElementById('live-video-stream').srcObject = activeStream; } catch (err) { alert("Camera access error: " + err.message); closeLiveVideo(); } }
    async function toggleCameraFacing() { triggerHaptic(20); useFrontCamera = !useFrontCamera; await startCameraStream(); }
    function closeLiveVideo() { triggerHaptic(20); if (activeStream) { activeStream.getTracks().forEach(track => track.stop()); activeStream = null; } document.getElementById('video-modal').classList.remove('active'); }

    function exportCurrentThreadPDF() {
      triggerHaptic(30); const { jsPDF } = window.jspdf; const doc = new jsPDF();
      doc.setFillColor(0, 0, 0); doc.rect(0, 0, 210, 297, 'F');
      doc.setTextColor(248, 250, 252); doc.setFont("Helvetica", "bold"); doc.setFontSize(18); doc.text("Project-Gifted1™ - Executive Thread Export", 15, 20);
      doc.setFont("Helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(148, 163, 184); doc.text("Session ID: " + currentThreadId + " | Timestamp: " + new Date().toLocaleString(), 15, 28);
      doc.setDrawColor(234, 179, 8); doc.line(15, 33, 195, 33);
      let yPos = 42; const bubbles = chatStream.querySelectorAll('.bubble-container');
      bubbles.forEach((container) => {
        const isUser = container.classList.contains('user'); const text = container.querySelector('.bubble').innerText;
        doc.setFont("Helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(isUser ? 253 : 255, isUser ? 224 : 255, isUser ? 71 : 255); doc.text(isUser ? "USER DIRECTIVE:" : "PG1-AGENT RESPONSE:", 15, yPos); yPos += 6;
        doc.setFont("Helvetica", "normal"); doc.setTextColor(226, 232, 240);
        const splitText = doc.splitTextToSize(text, 180); doc.text(splitText, 15, yPos); yPos += (splitText.length * 6) + 8;
        if (yPos > 275) { doc.addPage(); doc.setFillColor(0, 0, 0); doc.rect(0, 0, 210, 297, 'F'); yPos = 20; }
      });
      doc.save(`PG1_Thread_${Date.now()}.pdf`);
    }

    // Thread Persistence Matrix
    let currentThreadId = localStorage.getItem('pg1_active_thread') || 'thread_' + Date.now();
    let threads = JSON.parse(localStorage.getItem('pg1_threads') || '{}');
    if (!threads[currentThreadId]) { threads[currentThreadId] = { title: 'Initial Session', date: new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }), messages: chatStream.innerHTML }; saveThreadsToStorage(); } else { chatStream.innerHTML = threads[currentThreadId].messages; }
    function saveThreadsToStorage() { localStorage.setItem('pg1_threads', JSON.stringify(threads)); localStorage.setItem('pg1_active_thread', currentThreadId); }
    function persistCurrentThreadState() { if (threads[currentThreadId]) { threads[currentThreadId].messages = chatStream.innerHTML; saveThreadsToStorage(); } }

    function toggleVoice() { 
      triggerHaptic(20); 
      voiceEnabled = !voiceEnabled; 
      if (voiceEnabled) { 
        voiceToggleBtn.classList.add('active'); 
        voiceToggleBtn.innerText = "Voice: On"; 
        voiceStats.innerText = `Sys: Active | API Linked`; 
        speakText("Audio matrix online. PG1 engaged."); 
      } else { 
        voiceToggleBtn.classList.remove('active'); 
        voiceToggleBtn.innerText = "Voice: Off"; 
        voiceStats.innerText = "Sys: Ready | Standby"; 
      } 
    }
    
    function updateVoiceProfile() { 
      triggerHaptic(15); 
      if (voiceEnabled) { 
        voiceStats.innerText = `Sys: Active | ${voiceSelect.options[voiceSelect.selectedIndex].text}`; 
        speakText("Executive audio profile updated."); 
      } 
    }

    let recognition;
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.onstart = () => micBtn.classList.add('recording');
      recognition.onend = () => micBtn.classList.remove('recording');
      recognition.onresult = (e) => { userInput.value += (userInput.value ? ' ' : '') + e.results[0][0].transcript; };
      micBtn.addEventListener('click', () => { triggerHaptic(25); if (micBtn.classList.contains('recording')) recognition.stop(); else recognition.start(); });
    } else {
      micBtn.addEventListener('click', () => { triggerHaptic(25); alert("Speech Recognition is actively restricted or unsupported by this client browser."); });
    }

    // Audio Transport Routines
    function getVoiceReadyStatus() {
      return voiceEnabled ? `Sys: READY | ${voiceSelect.options[voiceSelect.selectedIndex].text}` : "Sys: READY | Standby";
    }

    function setVoicePlaybackStatus(isSpeaking) {
      voiceStats.innerText = isSpeaking ? "Sys: SPEAKING..." : getVoiceReadyStatus();
    }

    function getAudioPlayer() {
      if (!window.__pg1AudioPlayer) {
        const audioPlayer = new Audio();
        audioPlayer.preload = 'auto';
        audioPlayer.playsInline = true;
        window.__pg1AudioPlayer = audioPlayer;
      }
      return window.__pg1AudioPlayer;
    }

    function unlockAudioPlayer() {
      const audioPlayer = getAudioPlayer();
      if (audioPlayer.__pg1UnlockAttempted) return audioPlayer;
      audioPlayer.__pg1UnlockAttempted = true;
      const unlockAttempt = audioPlayer.play();
      if (unlockAttempt && typeof unlockAttempt.catch === 'function') {
        unlockAttempt.catch(() => {}).finally(() => {
          audioPlayer.pause();
          audioPlayer.currentTime = 0;
        });
      }
      return audioPlayer;
    }

    function releaseAudioPlayer(invokeCleanup = true) {
      const audioPlayer = window.__pg1AudioPlayer || null;
      if (!audioPlayer) return;
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      audioPlayer.onended = null;
      const cleanup = audioPlayer.__pg1Cleanup;
      audioPlayer.__pg1Cleanup = null;
      if (audioPlayer.__pg1ObjectUrl) {
        URL.revokeObjectURL(audioPlayer.__pg1ObjectUrl);
        audioPlayer.__pg1ObjectUrl = null;
      }
      if (invokeCleanup && typeof cleanup === 'function') {
        try {
          cleanup();
        } catch (err) {
          console.error("PG1 Voice completion callback error:", err);
        }
      }
    }

    function assignAudioSource(audioPlayer, audioPayload) {
      if (audioPayload instanceof Blob) {
        const audioUrl = URL.createObjectURL(audioPayload);
        audioPlayer.__pg1ObjectUrl = audioUrl;
        audioPlayer.src = audioUrl;
        return true;
      }
      if (typeof audioPayload !== 'string') return false;
      const normalizedAudio = audioPayload.trim().replace(/^data:[^,]+,/, '').replace(/\s+/g, '');
      if (!normalizedAudio) return false;
      audioPlayer.src = `data:audio/mp3;base64,${normalizedAudio}`;
      return true;
    }

    function playAudioPayload(audioPayload, onended) {
      const audioPlayer = unlockAudioPlayer();
      const cleanup = typeof onended === 'function' ? onended : null;
      releaseAudioPlayer(true);
      audioPlayer.__pg1Cleanup = cleanup;
      if (!assignAudioSource(audioPlayer, audioPayload)) {
        audioPlayer.__pg1Cleanup = null;
        setVoicePlaybackStatus(false);
        return Promise.resolve(false);
      }
      audioPlayer.onended = () => {
        setVoicePlaybackStatus(false);
        releaseAudioPlayer(true);
      };
      setVoicePlaybackStatus(true);
      return audioPlayer.play()
        .then(() => true)
        .catch(err => {
          console.log("Audio unlock required:", err);
          setVoicePlaybackStatus(false);
          releaseAudioPlayer(false);
          return false;
        });
    }

    async function parseSpeechResponse(response) {
      const responseType = response.headers.get('content-type') || '';
      if (responseType.includes('application/json')) {
        return response.json();
      }
      if (response.ok && responseType.startsWith('text/')) {
        const text = await response.text();
        const normalizedText = text.trim();
        const isAudioPayload = /^data:audio\/[^,]+,/.test(normalizedText) || /^[A-Za-z0-9+/=\s]+$/.test(normalizedText);
        return isAudioPayload ? { audio: text } : { audioStatus: 'FAILED', audioError: text || 'Audio unavailable' };
      }
      if (response.ok) return { audioBlob: await response.blob() };
      const arrayBuffer = await response.arrayBuffer();
      return { error: new TextDecoder().decode(arrayBuffer) };
    }

    async function speakText(text) {
      if (!voiceEnabled) return; 
      unlockAudioPlayer();
      try {
        const cleanText = text.replace(/[*_#`]/g, '').replace(/!\[.*?\]\(.*?\)/g, '').replace(/<video.*?>.*?<\/video>/g, '').replace(/\[CONSENT_REQUIRED\]/g, '');
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'SPEAK', prompt: cleanText, voice: voiceSelect.value })
        });
        const data = await parseSpeechResponse(response);
        if (!response.ok) throw new Error(data.error || 'API Request Failed');
        if (data.audio || data.audioBlob) {
          const played = await playAudioPayload(data.audio || data.audioBlob);
          if (!played) console.warn('PG1 Voice API Warning: audio playback was skipped.');
        } else if (data.audioStatus === 'FAILED') {
          throw new Error(data.audioError || data.error || 'Audio unavailable');
        } else {
          throw new Error('No audio payload returned');
        }
      } catch (err) {
        console.error('PG1 Voice API Error:', err);
      }
    }

    async function speakMessageText(btn) { 
      triggerHaptic(15); 
      unlockAudioPlayer();
      
      const container = btn.closest('.bubble-container'); 
      const bubble = container.querySelector('.bubble'); 
      const cleanText = bubble.innerText.replace(/[*_#`]/g, '');
      const originalText = btn.innerText;
      
      btn.innerText = "SPEAKING...";
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'SPEAK', prompt: cleanText, voice: voiceSelect.value })
        });
        const data = await parseSpeechResponse(response);
        if (!response.ok) throw new Error(data.error || 'API Request Failed');
        if (data.audio || data.audioBlob) {
          const played = await playAudioPayload(data.audio || data.audioBlob, () => {
            btn.innerText = "READY";
            setTimeout(() => { btn.innerText = originalText; }, 1200);
          });
          if (!played) {
            btn.innerText = "READY";
            setTimeout(() => { btn.innerText = originalText; }, 1200);
          }
        } else if (data.audioStatus === 'FAILED') {
          throw new Error(data.audioError || data.error || 'Audio unavailable');
        } else {
          throw new Error('No audio payload returned');
        }
      } catch (err) {
        console.error('PG1 Voice API Error:', err);
        btn.innerText = "Error";
        setTimeout(() => { btn.innerText = originalText; }, 2000);
      }
    }

    // Text & DOM Utilities
    function parseMarkdown(text) {
      let html = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>'); html = html.replace(/!\[([^\]]*)\]\((.*?)\)/g, '<img src="$2" alt="$1" />'); html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      if (html.includes('[CONSENT_REQUIRED]')) { html = html.replace('[CONSENT_REQUIRED]', ''); html += `<div class="consent-card"><div class="consent-header"><span class="consent-title">Authorization Required</span><span class="consent-trust-badge">Verified</span></div><div class="consent-actions"><button class="btn-consent btn-accept">Approve Action</button><button class="btn-consent btn-decline">Dismiss</button></div></div>`; }
      return html.split('\n').map(line => line.trim() ? (line.match(/^(<pre|<code|<img|<div|<button|<span|<header|<video)/) ? line : `<p>${line}</p>`) : '').join('\n');
    }

    function handleFileSelect(event) { triggerHaptic(20); const file = event.target.files[0]; if (!file) return; currentAttachment = file; document.getElementById('file-name').innerText = file.name; document.getElementById('file-preview').classList.add('active'); }
    function clearAttachment() { triggerHaptic(10); currentAttachment = null; document.getElementById('file-upload').value = ''; document.getElementById('file-preview').classList.remove('active'); }
    function submitConsent(decision) { triggerHaptic(30); userInput.value = `[SYSTEM_OVERRIDE]: User has selected to ${decision} the proposed action.`; sendMessage(); }
    function getTimeString() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

    function copyMessageText(btn) { triggerHaptic(15); const container = btn.closest('.bubble-container'); const bubble = container.querySelector('.bubble'); navigator.clipboard.writeText(bubble.innerText); btn.innerText = "Copied!"; setTimeout(() => { btn.innerText = "Copy"; }, 1500); }
    function editMessageText(btn) { triggerHaptic(15); const container = btn.closest('.bubble-container'); const bubble = container.querySelector('.bubble'); const currentText = bubble.innerText; if (container.querySelector('.edit-input')) return; const textarea = document.createElement('textarea'); textarea.className = 'edit-input'; textarea.value = currentText; textarea.rows = 2; bubble.style.display = 'none'; container.insertBefore(textarea, bubble); textarea.focus(); textarea.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const newText = textarea.value.trim(); textarea.remove(); bubble.style.display = 'block'; if (newText) { bubble.innerText = newText; persistCurrentThreadState(); userInput.value = newText; sendMessage(); } } else if (e.key === 'Escape') { textarea.remove(); bubble.style.display = 'block'; } }); }
    function deleteMessageBubble(btn) { triggerHaptic(25); const wrapper = btn.closest('.bubble-wrapper'); wrapper.style.opacity = '0'; wrapper.style.transform = 'scale(0.95)'; wrapper.style.transition = 'all 0.2s ease'; setTimeout(() => { wrapper.remove(); persistCurrentThreadState(); }, 200); }

    function openThreadManager() { triggerHaptic(20); renderThreadList(); document.getElementById('thread-modal').classList.add('active'); }
    function closeThreadManager() { document.getElementById('thread-modal').classList.remove('active'); }
    
    function renderThreadList() { 
      const listContainer = document.getElementById('thread-list'); 
      listContainer.innerHTML = ''; 
      Object.keys(threads).forEach(id => { 
        const thread = threads[id]; 
        const item = document.createElement('div'); 
        item.className = `thread-item ${id === currentThreadId ? 'active-thread' : ''}`; 
        item.dataset.id = id;
        item.innerHTML = `<div style="display:flex;flex-direction:column;gap:2px;overflow:hidden;width:100%;"><span style="font-size:12px;font-weight:500;color:var(--text-main);">${thread.title}</span><span style="font-size:9px;color:var(--text-muted);font-family:var(--font-mono);">${thread.date}</span></div><button class="icon-btn delete-thread-btn" style="width:26px;height:26px;animation:none;">✕</button>`; 
        listContainer.appendChild(item); 
      }); 
    }
    
    function switchThread(id) { triggerHaptic(20); persistCurrentThreadState(); currentThreadId = id; chatStream.innerHTML = threads[currentThreadId].messages; saveThreadsToStorage(); closeThreadManager(); scrollToBottom(); }
    function deleteThreadSession(id) { triggerHaptic(30); if (Object.keys(threads).length <= 1) { alert("Cannot delete the only remaining thread."); return; } delete threads[id]; if (currentThreadId === id) { currentThreadId = Object.keys(threads)[0]; chatStream.innerHTML = threads[currentThreadId].messages; } saveThreadsToStorage(); renderThreadList(); }
    
    function createNewThread() { 
      triggerHaptic(25); persistCurrentThreadState(); 
      currentThreadId = 'thread_' + Date.now(); 
      threads[currentThreadId] = { title: 'New Directive', date: new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }), messages: `<div class="bubble-wrapper"><div class="bubble-container bot"><div class="bubble">Greetings. New session initialized. PG1 Sovereign Agent operational.</div><div class="message-meta"><span class="timestamp">${getTimeString()}</span><div class="message-tools"><button class="tool-action speak-btn">Speak</button><button class="tool-action copy-btn">Copy</button><button class="tool-action delete-btn">Delete</button></div></div></div></div>` }; 
      chatStream.innerHTML = threads[currentThreadId].messages; saveThreadsToStorage(); 
    }
    function saveCurrentThreadAndCreateNew() { persistCurrentThreadState(); closeThreadManager(); createNewThread(); }

    // Core Interaction Engine
    async function sendMessage() {
      triggerHaptic(25);
      const promptText = userInput.value.trim();
      if (!promptText && !currentAttachment) return;

      if (voiceEnabled) { unlockAudioPlayer(); }
      
      const promptToDisplay = promptText || "Analyze the attached file.";
      if (threads[currentThreadId].title === 'Initial Session' || threads[currentThreadId].title === 'New Directive') {
        threads[currentThreadId].title = promptToDisplay.substring(0, 28) + (promptToDisplay.length > 28 ? '...' : '');
      }

      userInput.value = ''; 
      appendUserMessage(promptToDisplay.replace('[SYSTEM_OVERRIDE]: ', '') + (currentAttachment ? ' 📎 [File Attached]' : '')); 
      sendBtn.disabled = true;
      
      const wrapper = document.createElement('div'); 
      wrapper.className = 'bubble-wrapper'; 
      wrapper.innerHTML = `<div class="bubble-container bot"><div class="bubble" style="opacity:0.65">Executing directive...</div><div class="message-meta"><span class="timestamp">${getTimeString()}</span></div></div>`;
      chatStream.appendChild(wrapper); 
      scrollToBottom();
      persistCurrentThreadState();

      try {
        let filePayload = null;
        let vaultUrl = null;
        
        if (currentAttachment) {
          const MAX_FILE_SIZE = 4 * 1024 * 1024;
          if (currentAttachment.size > MAX_FILE_SIZE) {
            const bubble = wrapper.querySelector('.bubble');
            bubble.innerText = "Media payload exceeds Vercel 4.5MB pipeline limit. Rerouting via direct-to-object-storage vault...";
            
            const authRes = await fetch('/api/vault-auth', { method: 'POST' });
            if (!authRes.ok) throw new Error("Vault architecture offline. Backend endpoint '/api/vault-auth' failed.");
            const { url: sbUrl, key: sbKey } = await authRes.json();
            
            bubble.innerText = "Streaming encrypted payload directly to storage vault...";
            const fileName = `pg1_vault_${Date.now()}_${currentAttachment.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
            
            const uploadRes = await fetch(`${sbUrl}/storage/v1/object/pg1-vault/${fileName}`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${sbKey}`, 'apikey': sbKey, 'Content-Type': currentAttachment.type },
              body: currentAttachment
            });

            if (!uploadRes.ok) {
              const errData = await uploadRes.json().catch(()=>({}));
              throw new Error(errData.message || "Direct storage stream failed. Ensure 'pg1-vault' bucket exists in Supabase and allows public inserts.");
            }
            vaultUrl = `${sbUrl}/storage/v1/object/public/pg1-vault/${fileName}`;
            bubble.innerText = "Payload vaulted successfully. Analyzing matrix...";
          } else {
            const reader = new FileReader();
            const base64Promise = new Promise(resolve => { reader.onload = () => resolve(reader.result.split(',')[1]); });
            reader.readAsDataURL(currentAttachment);
            filePayload = { inlineData: { data: await base64Promise, mimeType: currentAttachment.type } };
          }
        }

        const finalPrompt = vaultUrl ? `${promptToDisplay}\n\n[SYSTEM NOTIFICATION: User has transmitted a heavy payload directly to the storage vault at URL: ${vaultUrl}. Process and analyze this link accordingly.]` : promptToDisplay;

        const res = await fetch(`/api/chat?t=${Date.now()}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' },
          body: JSON.stringify({ prompt: finalPrompt, file: filePayload }) 
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const reply = data.reply || 'Execution complete.';
        
        const container = wrapper.querySelector('.bubble-container');
        const bubble = container.querySelector('.bubble');
        bubble.style.opacity = '1';
        bubble.innerHTML = parseMarkdown(reply);

        // Native Image Generation Renderer Injection
        if (data.image) {
          const imgElement = document.createElement('img');
          imgElement.src = `data:image/png;base64,${data.image}`;
          imgElement.alt = 'Generated response image';
          imgElement.style.maxWidth = '100%';
          imgElement.style.borderRadius = '8px';
          imgElement.style.marginTop = '10px';
          imgElement.style.display = 'block';
          bubble.appendChild(imgElement);
        }
        
        const metaDiv = container.querySelector('.message-meta');
        metaDiv.innerHTML = `<span class="timestamp">${getTimeString()}</span><div class="message-tools"><button class="tool-action speak-btn">Speak</button><button class="tool-action copy-btn">Copy</button><button class="tool-action delete-btn">Delete</button></div>`;
        
        scrollToBottom(); 
        persistCurrentThreadState();

        if (voiceEnabled) {
          if (data.audio) {
            playAudioPayload(data.audio).catch(() => {});
          } else {
            speakText(reply);
          }
        }
      } catch (err) {
        const bubble = wrapper.querySelector('.bubble');
        bubble.style.opacity = '1';
        bubble.innerText = `System Alert: ${err.message}.`;
        persistCurrentThreadState();
      } finally { 
        sendBtn.disabled = false;
        clearAttachment();
      }
    }

    function appendUserMessage(text) { 
      const wrapper = document.createElement('div'); wrapper.className = 'bubble-wrapper'; 
      wrapper.innerHTML = `<div class="bubble-container user"><div class="bubble">${text}</div><div class="message-meta"><span class="timestamp">${getTimeString()}</span><div class="message-tools"><button class="tool-action edit-btn">Edit</button><button class="tool-action copy-btn">Copy</button><button class="tool-action delete-btn">Delete</button></div></div></div>`; 
      chatStream.appendChild(wrapper); scrollToBottom(); persistCurrentThreadState(); 
    }
    
    function scrollToBottom() { chatStream.scrollTop = chatStream.scrollHeight; }
    
    // --- EXPLICIT EVENT LISTENER BINDINGS ---
    // Header Actions
    document.getElementById('btn-live-video').addEventListener('click', openLiveVideo);
    document.getElementById('btn-export-pdf').addEventListener('click', exportCurrentThreadPDF);
    document.getElementById('btn-vault').addEventListener('click', openThreadManager);
    document.getElementById('btn-new-thread').addEventListener('click', createNewThread);
    
    // Modals
    document.getElementById('btn-close-video1').addEventListener('click', closeLiveVideo);
    document.getElementById('btn-flip-camera').addEventListener('click', toggleCameraFacing);
    document.getElementById('btn-end-stream').addEventListener('click', closeLiveVideo);
    
    document.getElementById('thread-modal').addEventListener('click', (e) => { if (e.target.id === 'thread-modal') closeThreadManager(); });
    document.getElementById('btn-close-vault').addEventListener('click', closeThreadManager);
    document.getElementById('btn-save-new').addEventListener('click', saveCurrentThreadAndCreateNew);
    
    // Core Functions
    document.getElementById('voice-toggle').addEventListener('click', toggleVoice);
    document.getElementById('voice-select').addEventListener('change', updateVoiceProfile);
    
    document.getElementById('attach-btn').addEventListener('click', () => document.getElementById('file-upload').click());
    document.getElementById('file-upload').addEventListener('change', handleFileSelect);
    document.getElementById('btn-clear-attach').addEventListener('click', clearAttachment);
    
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('user-input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

    // Dynamic Event Delegation for Bubbles
    chatStream.addEventListener('click', (e) => {
      const btn = e.target.closest('.tool-action');
      if (btn) {
        if (btn.classList.contains('speak-btn')) speakMessageText(btn);
        else if (btn.classList.contains('copy-btn')) copyMessageText(btn);
        else if (btn.classList.contains('edit-btn')) editMessageText(btn);
        else if (btn.classList.contains('delete-btn')) deleteMessageBubble(btn);
        return;
      }
      const consentBtn = e.target.closest('.btn-consent');
      if (consentBtn) {
        if (consentBtn.classList.contains('btn-accept')) submitConsent('ACCEPT');
        else submitConsent('DECLINE');
      }
    });

    // Dynamic Event Delegation for Thread Vault
    document.getElementById('thread-list').addEventListener('click', (e) => {
      const item = e.target.closest('.thread-item');
      if (!item) return;
      const id = item.dataset.id;
      if (e.target.closest('.delete-thread-btn')) {
        deleteThreadSession(id);
      } else {
        switchThread(id);
      }
    });
  </script>
