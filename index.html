<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PG1 Sovereign Agent™ | Project-Gifted1™</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0e121b;
      --bg-elevated: #151a27;
      --bg-bubble-bot: #121824;
      --bg-bubble-user: #182338;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-glow: rgba(0, 242, 254, 0.25);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-emerald: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #8492a6;
      --text-dim: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 250px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(79, 172, 254, 0.02) 70%, transparent 100%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      background: rgba(14, 18, 27, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      color: #06080d;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
      flex-shrink: 0;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .brand-sub {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .network-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(0, 242, 254, 0.05);
      border: 1px solid var(--border-glow);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent-cyan);
      white-space: nowrap;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-cyan);
      animation: beacon 2s infinite ease-in-out;
    }

    @keyframes beacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .message-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .badge-tag {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.04em;
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 242, 254, 0.25);
    }

    .message {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border-subtle);
    }

    .message.user {
      align-self: flex-end;
      background: var(--bg-bubble-user);
      border-color: rgba(79, 172, 254, 0.2);
      max-width: 84%;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bg-bubble-bot);
      border-color: var(--border-subtle);
      max-width: 90%;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 8px 0;
      scrollbar-width: none;
    }

    .quick-actions::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-btn:active {
      background: rgba(0, 242, 254, 0.1);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    footer {
      position: relative;
      z-index: 10;
      background: rgba(14, 18, 27, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      padding: 12px 16px env(safe-area-inset-bottom, 12px);
    }

    .input-frame {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 6px 6px 6px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.15);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      resize: none;
      max-height: 100px;
      height: 24px;
      outline: none;
    }

    textarea::placeholder {
      color: var(--text-dim);
    }

    button.send-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, opacity 0.2s;
    }

    button.send-btn svg {
      width: 16px;
      height: 16px;
      fill: #06080d;
    }

    button.send-btn:active {
      transform: scale(0.92);
    }

    button.send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .loading-pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid var(--accent-cyan);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <header>
    <div class="brand-cluster">
      <div class="brand-mark">PG1</div>
      <div class="brand-meta">
        <span class="brand-title">PG1 Sovereign Agent™</span>
        <span class="brand-sub">Project-Gifted1™ Core</span>
      </div>
    </div>
    <div class="network-pill">
      <span class="pulse-dot"></span>
      <span>1,500 Nodes Active</span>
    </div>
  </header>

  <main id="chat-stream">
    <div class="message-container">
      <div class="badge-bar">
        <span class="badge-tag">[PG1]</span>
        <span>System Initialized</span>
      </div>
      <div class="message bot">
        Greetings. PG1 Sovereign Agent™ is operational and synchronized with the 1,500-node infrastructure under Project-Gifted1™. 

Submit your directive or select a command below to begin execution.
      </div>
    </div>
  </main>

  <footer>
    <div class="input-frame">
      <div class="quick-actions">
        <button class="chip-btn" onclick="sendQuickPrompt('Generate system architecture status and node verification report.')">⚡ Status Report</button>
        <button class="chip-btn" onclick="sendQuickPrompt('Review revenue strike deliverability and protocol parameters.')">📊 Protocol Review</button>
        <button class="chip-btn" onclick="sendQuickPrompt('Explain your full operational capabilities and sovereign mandate.')">🛡️ Capabilities</button>
      </div>

      <div class="input-box">
        <textarea id="user-input" placeholder="Execute directive or query agent..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" onclick="sendMessage()" aria-label="Send Directive">
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <script>
    const chatStream = document.getElementById('chat-stream');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight < 100 ? this.scrollHeight : 100) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendQuickPrompt(text) {
      userInput.value = text;
      sendMessage();
    }

    async function sendMessage() {
      const prompt = userInput.value.trim();
      if (!prompt) return;

      userInput.value = '';
      userInput.style.height = '24px';
      appendMessage('user', prompt);
      sendBtn.disabled = true;

      const loadingContainer = appendLoading();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            prompt: prompt,
            userMessage: prompt,
            message: prompt
          })
        });

        const data = await res.json();
        loadingContainer.remove();

        if (!res.ok) {
          appendMessage('bot', `System Error: ${data.error || 'Execution interrupted'}`);
        } else {
          appendMessage('bot', data.reply || 'Execution complete.');
        }
      } catch (err) {
        loadingContainer.remove();
        appendMessage('bot', `Network Error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    function appendMessage(role, text) {
      const container = document.createElement('div');
      container.className = 'message-container';

      if (role === 'bot') {
        const badgeBar = document.createElement('div');
        badgeBar.className = 'badge-bar';
        badgeBar.innerHTML = `<span class="badge-tag">[PG1]</span> <span>Sovereign Output</span>`;
        container.appendChild(badgeBar);
      }

      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      container.appendChild(msg);

      chatStream.appendChild(container);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function appendLoading() {
      const container = document.createElement('div');
      container.className = 'message-container';
      const msg = document.createElement('div');
      msg.className = 'message bot';
      msg.innerHTML = '<span class="loading-pulse"></span> Processing directive across Project-Gifted1™...';
      container.appendChild(msg);
      chatStream.appendChild(container);
      chatStream.scrollTop = chatStream.scrollHeight;
      return container;
    }
  </script>
</body>
</html>
