<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PG1 Agent Console</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background-color: #0b1120;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    h2 {
      font-size: 1.25rem;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    .camera-container {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cam-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
    }

    .cam-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .terminal {
      width: 100%;
      height: 220px;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      overflow-y: auto;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .terminal div {
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .controls-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: white;
      cursor: pointer;
      padding: 10px 14px;
      transition: background-color 0.2s;
    }

    #speechOutputBtn {
      flex: 1;
      background-color: #10b981;
    }

    #voiceToggleBtn {
      flex: 1;
      background-color: #0284c7;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    #cmdInput {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      padding: 0 12px;
      font-size: 0.9rem;
      outline: none;
    }

    #cmdInput:focus {
      border-color: #38bdf8;
    }

    #executeBtn {
      background-color: #0284c7;
      padding: 10px 16px;
    }

    #micStatus.recording {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #ef4444;
      border-radius: 50%;
      margin-left: 8px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>PG1 Agent Console</h2>
      <span id="micStatus"></span>
    </div>

    <div class="camera-container">
      <video id="webcam" autoplay playsinline muted></video>
      <div class="cam-controls">
        <button class="cam-btn" onclick="toggleCamera()">Flip Camera</button>
      </div>
    </div>
    
    <div id="terminal" class="terminal"></div>

    <div class="controls-row">
      <button id="speechOutputBtn" onclick="toggleAudioOutput()">Audio: ON</button>
      <button id="voiceToggleBtn" onclick="toggleVoice()">Voice: OFF</button>
    </div>

    <div class="input-row">
      <input type="text" id="cmdInput" placeholder="Type or speak command..." onkeypress="if(event.key==='Enter') handleManualSend()" />
      <button id="executeBtn" onclick="handleManualSend()">Execute</button>
    </div>
  </div>

  <canvas id="frameCanvas" style="display:none;"></canvas>
  <script src="app.js"></script>
</body>
</html>
