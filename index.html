<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PG1 Console</title>
  <style>
    body { background: #0b0f19; color: #fff; font-family: monospace; padding: 20px; }
    .console-box { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 15px; max-width: 600px; margin: auto; }
    .terminal-log { background: #030712; height: 180px; overflow-y: auto; padding: 10px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #374151; background: #1f2937; color: #fff; }
    button { padding: 10px 15px; border: none; border-radius: 4px; background: #0284c7; color: #fff; cursor: pointer; }
    button.active { background: #dc2626; }
    .mic-indicator { width: 12px; height: 12px; border-radius: 50%; background: #4b5563; display: inline-block; margin-right: 5px; }
    .mic-indicator.recording { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  </style>
</head>
<body>

<div class="console-box">
  <h3>PG1 Agent Voice & Terminal Console</h3>
  <div class="terminal-log" id="terminal"></div>
  
  <div class="input-row">
    <span class="mic-indicator" id="micStatus"></span>
    <button id="voiceToggleBtn" onclick="toggleVoice()">Voice: OFF</button>
    <input type="text" id="cmdInput" placeholder="Type or speak command...">
    <button onclick="handleManualSend()">Execute</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
