<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gifted1™ | Command Center</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-blue: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-red: #f87171;
            --success-green: #4ade80;
        }

        body {
            margin: 0;
            padding: 16px 16px 90px 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--success-green);
            border-radius: 50%;
            display: inline-block;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .video-box {
            width: 100%;
            height: 200px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 16px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn {
            width: 100%;
            background-color: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn:active {
            opacity: 0.85;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .execute-btn {
            background-color: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .terminal-box {
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            height: 120px;
            overflow-y: auto;
            color: var(--text-muted);
        }

        .terminal-box .sys { color: var(--accent-blue); }
        .terminal-box .err { color: var(--error-red); }
        .terminal-box .ok { color: var(--success-green); }

        /* Bottom Fixed Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #090d16;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><span class="status-dot"></span> Project Gifted1™</h1>
            <span style="font-size: 0.85rem; color: var(--text-muted);">v2.4 Node</span>
        </header>

        <!-- Sovereign Status Card -->
        <div class="card">
            <div style="font-weight: 600; margin-bottom: 4px;">Sovereign Edge Active</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">Zero-cost deployment operational via PG1 core edge synchronization. All telemetry feeds secure.</div>
        </div>

        <!-- Video Stream Card -->
        <div class="card">
            <div class="video-box">
                <video id="webcam" autoplay playsinline></video>
            </div>
            <button id="stream-btn" class="btn">📹 Initialize Live Stream Feed</button>
            
            <div class="input-group">
                <input type="text" id="command-input" placeholder="Type command or query...">
                <button class="execute-btn" id="execute-btn">Execute</button>
            </div>
        </div>

        <!-- Terminal Output Card -->
        <div class="card">
            <div id="terminal" class="terminal-box">
                > [SYSTEM]: Secure terminal initialized. Ready for instructions.<br>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('dash')">
            📊 <span>Dash</span>
        </button>
        <button class="nav-item" onclick="switchTab('terminal')">
            ⚡ <span>Terminal</span>
        </button>
        <button class="nav-item" onclick="switchTab('node')">
            👤 <span>Node</span>
        </button>
    </nav>

    <script>
        const terminal = document.getElementById('terminal');
        const videoElement = document.getElementById('webcam');
        const streamBtn = document.getElementById('stream-btn');
        const commandInput = document.getElementById('command-input');
        const executeBtn = document.getElementById('execute-btn');

        function logToTerminal(message, type = 'sys') {
            const timestamp = new Date().toLocaleTimeString();
            let colorClass = 'sys';
            if (type === 'err') colorClass = 'err';
            if (type === 'ok') colorClass = 'ok';
            
            terminal.innerHTML += `> [<span class="${colorClass}">${timestamp}</span>]: ${message}<br>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Synchronous handler for iOS Safari camera & audio permissions
        streamBtn.addEventListener('click', function() {
            logToTerminal("Requesting media stream permissions...");

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user' }, 
                audio: true 
            })
            .then(function(stream) {
                videoElement.srcObject = stream;
                logToTerminal("Live stream feed initialized successfully.", "ok");
            })
            .catch(function(error) {
                logToTerminal(`Media stream failed – ${error.name}: ${error.message}`, "err");
            });
        });

        // Command execution handler
        executeBtn.addEventListener('click', function() {
            const cmd = commandInput.value.trim();
            if (!cmd) return;
            logToTerminal(`Executing command: ${cmd}`);
            commandInput.value = '';
        });

        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            logToTerminal(`Switched view context to: ${tabName.toUpperCase()}`);
        }
    </script>
</body>
</html>
