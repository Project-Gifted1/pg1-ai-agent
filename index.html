<div class="card">
  <h3>⚡ x402 Sovereign Key Relay</h3>
  <p>Inject your Master Key to ignite live PG1.Agent node interactions.</p>
  
  <input type="password" id="master-key-input" placeholder="Enter Master Key..." style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;" />
  <button id="save-key-btn" style="background: #00c853; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; width: 100%;">Save Key</button>
  
  <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
    <span id="key-status-text">KEY_STATUS: NOT_SET</span>
    <span id="connection-indicator" style="color: red; font-weight: bold;">● DISCONNECTED</span>
  </div>
</div>

<script>
  document.getElementById("save-key-btn").addEventListener("click", function() {
    const keyValue = document.getElementById("master-key-input").value;
    if (!keyValue) {
      alert("Please enter a valid key.");
      return;
    }
    
    // Save to local storage and update UI instantly
    localStorage.setItem("pg1_master_key", keyValue);
    document.getElementById("key-status-text").innerText = "KEY_STATUS: ACTIVE";
    
    const indicator = document.getElementById("connection-indicator");
    indicator.innerText = "● CONNECTED";
    indicator.style.color = "#00c853";
    
    alert("Key saved and node successfully connected!");
  });
</script>
