<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gifted1 Node</title>
    <style>
        body { background-color: #0b0b0e; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 16px; }
        .card { background: #141418; border: 1px solid #22222a; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px; }
        .logo-img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; border: 2px solid #3b82f6; }
        .node-title { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
        .node-subtitle { font-size: 13px; color: #9ca3af; margin-bottom: 20px; }
        .stats-grid { display: flex; justify-content: space-around; border-top: 1px solid #22222a; padding-top: 16px; }
        .stat-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; }
        .stat-value { font-size: 16px; font-weight: bold; margin-top: 4px; }
        .info-box { background: #141418; border: 1px solid #22222a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .info-header { font-weight: bold; font-size: 16px; margin-bottom: 8px; }
        .info-text { font-size: 13px; color: #9ca3af; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- Node View Card with Logo and Custom Text -->
    <div class="card">
        <img src="logo.png" alt="PG1 Emblem" class="logo-img">
        <div class="node-title">PG1.Agent</div>
        <div class="node-subtitle">Autonomous Edge Infrastructure</div>
        
        <div class="stats-grid">
            <div>
                <div class="stat-label">Hosting</div>
                <div class="stat-value" style="color: #3b82f6;">PG1 Core</div>
            </div>
            <div>
                <div class="stat-label">State</div>
                <div class="stat-value" style="color: #10b981;">Active</div>
            </div>
        </div>
    </div>

    <!-- Dash Info View -->
    <div class="info-box" style="border-left: 4px solid #3b82f6;">
        <div class="info-header">Sovereign Edge Active</div>
        <div class="info-text">Zero-cost deployment operational via PG1 edge synchronization. All telemetry feeds secure.</div>
    </div>

</body>
</html>
