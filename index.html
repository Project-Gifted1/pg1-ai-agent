<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project Gifted1 | Live Feed</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #121212;
            --border: #262626;
            --text-main: #f5f5f5;
            --text-muted: #a3a3a3;
            --accent: #0095f6;
            --success: #22c55e;
            --accent-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        
        /* Subtle animated background noise */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQMAAADCCAMAAAB6zFdcAAAAElBMVEX/////v7//3jD/yDD/zjD/0jCHkYlPAAAAFHRSTlMAVQECAwQFBgcICQoLDA0ODx+KstkAAAEoSURBVHja7daxDoMwDEVRU/7/05ZomTZxWwu3QhBIXN7y6x8K5fF61u149/N4f/vj/j3+9vX7+Z/X/2y7Z9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brNv26zb9us2/brMv3Xbj1203ft1249dtN37ddtu3P02/AfZ/7vWkAAAAAElFTkSuQmCC');
            opacity: 0.03; /* Very subtle */
            pointer-events: none;
            z-index: -1;
            animation: grain 8s steps(10) infinite;
        }

        @keyframes grain {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -5%); }
            20% { transform: translate(-10%, 5%); }
            30% { transform: translate(5%, -10%); }
            40% { transform: translate(-5%, 15%); }
            50% { transform: translate(-10%, 5%); }
            60% { transform: translate(15%, 0%); }
            70% { transform: translate(0%, 15%); }
            80% { transform: translate(3%, 3%); }
            90% { transform: translate(-15%, 10%); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            position: relative;
            padding-bottom: 60px; /* Space for nav */
        }
        
        /* Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border);
            background: #000000;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .logo {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -1px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-icon {
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .header-icon:active { transform: scale(0.9); }

        /* Stories Reel */
        .stories-reel {
            display: flex;
            gap: 1rem;
            padding: 0.75rem 1rem;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            scrollbar-width: none; /* Firefox */
        }
        .stories-reel::-webkit-scrollbar { display: none; }
        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            flex-shrink: 0;
        }
        .story-ring {
            width: 64px; height: 64px;
            border-radius: 50%;
            padding: 3px;
            /* Apply pulse animation to the live node */
            background: var(--accent-gradient);
            display: flex; align-items: center; justify-content: center;
        }
        .story-ring.live {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(0, 149, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 149, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 149, 246, 0); }
        }
        .story-avatar {
            width: 58px; height: 58px;
            background: #1a1a1a;
            border-radius: 50%;
            border: 2px solid #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700; color: var(--text-main);
        }
        .story-name {
            font-size: 0.75rem;
            color: var(--text-main);
            font-weight: 500;
        }

        /* Views */
        .view-section {
            display: none;
            flex: 1;
            overflow-y: auto;
            /* Smooth fade transition between views */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .view-section.active {
            display: flex;
            flex-direction: column;
            opacity: 1;
        }

        /* Posts */
        .post {
            background: var(--bg);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .post-header {
            display: flex; align-items: center;
            padding: 0.75rem 1rem; gap: 0.75rem;
        }
        .post-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: bold;
        }
        .post-user-info { display: flex; flex-direction: column; }
        .post-user { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
        .post-location { font-size: 0.7rem; color: var(--text-muted); }
        
        .post-media {
            width: 100%;
            aspect-ratio: 1/1; /* Perfect square */
            background: #080808;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 2rem; box-sizing: border-box;
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        /* Animated scanline effect on media */
        .post-media::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255, 255, 255, 0.05);
            animation: scanline 3s linear infinite;
        }
        @keyframes scanline {
            0% { top: 0; }
            100% { top: 100%; }
        }
        
        .post-actions {
            display: flex; gap: 1rem;
            padding: 0.75rem 1rem;
            font-size: 1.5rem;
        }
        .action-btn {
            background: none; border: none;
            color: var(--text-main);
            padding: 0; cursor: pointer;
            transition: transform 0.2s;
            line-height: 1;
        }
        .action-btn:active { transform: scale(1.2); }
        .action-btn.red { color: #ef4444; }

        .post-likes { font-size: 0.9rem; font-weight: 600; padding: 0 1rem 0.5rem 1rem; }
        .post-caption { padding: 0 1rem 1rem 1rem; font-size: 0.9rem; line-height: 1.4; }
        .post-caption span { font-weight: 600; margin-right: 0.4rem; }
        .time-ago { font-size: 0.75rem; color: var(--text-muted); padding: 0 1rem 1rem 1rem; text-transform: uppercase; letter-spacing: 1px;}

        /* Chat View */
        .chat-view {
            display: flex; flex-direction: column;
            height: calc(100vh - 110px); /* Adjust for header/nav */
            box-sizing: border-box;
        }
        .chat-header {
            display: flex; align-items: center; padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border); background: #000000;
            position: sticky; top: 51px; z-index: 10;
        }
        .chat-header-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--accent-gradient);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; margin-right: 0.75rem;
        }
        .chat-messages {
            flex: 1; overflow-y: auto;
            padding: 1rem;
            display: flex; flex-direction: column; gap: 0.75rem;
            background: #000000;
        }
        .bubble {
            max-width: 75%;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            animation: pop-in 0.2s ease-out;
        }
        @keyframes pop-in {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .bubble.agent {
            background: #262626;
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .bubble.operator {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        /* Typing Indicator */
        .typing-indicator {
            align-self: flex-start;
            background: #262626;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: none; /* Hidden by default */
            gap: 4px;
        }
        .typing-indicator.active { display: flex; }
        .typing-dot {
            width: 8px; height: 8px; background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .chat-input-area {
            padding: 0.75rem; border-top: 1px solid var(--border);
            background: #000000; display: flex; gap: 0.5rem;
            position: sticky; bottom: 0;
        }
