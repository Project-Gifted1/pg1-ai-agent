<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Project Gifted1™ v12.8 Sovereign Engine</title>
  <style>
    :root {
      --bg-main: #0b111e;
      --bg-card: #111a2e;
      --bg-input: #080d18;
      --border-color: #1e2d4a;
      --primary-green: #00e676;
      --primary-cyan: #00d2ff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--primary-green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--primary-green);
    }
    .version-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Fixed Controls Bar with wrapping to prevent cutoff */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-color);
      background: #080d18;
    }
    .control-btn {
      background: #162238;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .control-btn.active, .control-btn.sentinel-active {
      border-color: var(--primary-green);
      color: var(--primary-green);
      background: rgba(0, 230, 118, 0.1);
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .view-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .view-panel.active {
      display: flex;
    }

    .terminal-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      position: relative;
    }
    .agent-status-card {
      border: 1px solid rgba(0, 230, 118, 0.4);
    }
    .card-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
    }
    .mini-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text-muted);
      font-size: 0.6rem;
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
    }
    .card-text {
      font-size: 0.85rem;
      line-height: 1.3;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cron-log {
      color: #64748b;
      font-style: italic;
      font-size: 0.78rem;
    }

    .relay-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }
    .relay-title {
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    .input-field {
      width: 100%;
      background: #080e1b;
      border: 1px solid var(--border-color);
      color: white;
      padding: 8px;
      border-radius: 6px;
      margin: 4px 0;
      font-size: 0.8rem;
    }
    .btn-green {
      background: #059669;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    /* Clean Prompt Input Area */
    .prompt-container {
      padding: 8px 10px;
      background: var(--bg-main);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .media-btn, .voice-note-trigger {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 7px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    .prompt-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: white;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .send-btn {
      background: #00c853;
      color: #0b111e;
      border: none;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid var(--border-color);
      background: #080d1a;
      padding: 6px 0 8px 0;
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-muted);
      font-size: 0.7rem;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
    }
    .nav-tab.active {
      color: var(--primary-cyan);
      font-weight: 600;
    }
    .nav-tab span {
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span class="status-dot"></span> Project Gifted1™
    </div>
    <div class="version-tag">v12.8 Sovereign Engine</div>
  </header>

  <!-- Fixed Controls Bar -->
  <section class="controls-bar">
    <button class="control-btn" id="vid-toggle" onclick="runtime.toggleVideo()">📹 Vid: <span id="vid-status">OFF</span></button>
    <button class="control-btn" id="dictate-toggle" onclick="runtime.toggleDictate()">🎙️ Dictate: <span id="dictate-status">OFF</span></button>
    <button class="control-btn" id="voice-toggle" onclick="runtime.toggleVoice()">🗣️ Voice: <span id="voice-status">OFF</span></button>
    <button class="control-btn" id="voices-btn" onclick="runtime.showVoiceSettings()">⚙️ Voices</button>
    <button class="control-btn sentinel-active" id="sentinel-toggle" onclick="runtime.toggleSentinel()">🛡️ Sentinel: <span id="sentinel-status">ON</span></button>
    <button class="control-btn active" id="chron-toggle" onclick="runtime.toggleChron()">⏱️ Chron: <span id="chron-status">ON</span></button>
    <button class="control-btn" onclick="runtime.clearTerminal()">🗑️</button>
  </section>

  <main>
    <div class="view-panel active" id="terminal-view">
      <div class="terminal-card agent-status-card">
        <div class="card-actions">
          <button class="mini-btn" onclick="runtime.copyText(this)">Copy</button>
        </div>
        <div class="card-text">PG1.Agent v12.8 online.&#10;Sovereign neural identity anchored.</div>
      </div>
      <div class="terminal-card">
        <div class="card-actions">
          <button class="mini-btn" onclick="runtime.copyText(this)">Copy</button>
        </div>
        <div class="card-text cron-log">[Chron Protocol] Background loop engaged</div>
      </div>
      <div class="terminal-card">
        <div class="card-actions">
          <button class="mini-btn" onclick="runtime.copyText(this)">Copy</button>
        </div>
        <div class="card-text cron-log">[Chron Trigger] System health check: ALL NOMINAL</div>
      </div>
      <div id="terminal-stream"></div>
    </div>

    <div class="view-panel" id="dash-view">
      <div class="relay-card">
        <div class="relay-title">⚡ X402 SOVEREIGN KEY RELAY</div>
        <input type="password" class="input-field" value="••••••••••••••••" />
        <button class="btn-green" onclick="alert('Keys Stored Local')">Save Keys</button>
      </div>
    </div>

    <div class="view-panel" id="core-view">
      <div class="relay-card">
        <div class="relay-title">🧠 CORE ENGINE & VAULT</div>
        <p style="font-size: 0.8rem;">IndexedDB: PG1_MemoryVault_v12_8</p>
      </div>
    </div>
  </main>

  <div class="prompt-container">
    <button class="media-btn" title="Attach Media">📸</button>
    <button class="voice-note-trigger" id="voice-note-btn" title="Voice Note" onclick="runtime.recordVoiceNote()">🎤</button>
    <input type="text" id="prompt-input" class="prompt-input" placeholder="Type prompt, or request live" onkeydown="if(event.key==='Enter') runtime.sendPrompt()" />
    <button class="send-btn" onclick="runtime.sendPrompt()">Send</button>
  </div>

  <nav class="bottom-nav">
    <button class="nav-tab" onclick="runtime.switchTab('dash', this)"><span>📊</span> Dash</button>
    <button class="nav-tab active" onclick="runtime.switchTab('terminal', this)"><span>⚡</span> Terminal</button>
    <button class="nav-tab" onclick="runtime.switchTab('core', this)"><span>🧠</span> Core</button>
  </nav>

  <script>
    class PG1SovereignRuntime {
      constructor() {
        this.state = { sentinel: true, video: false, voice: false, dictate: false, chron: true };
      }
      toggleSentinel() {
        this.state.sentinel = !this.state.sentinel;
        const btn = document.getElementById('sentinel-toggle');
        const txt = document.getElementById('sentinel-status');
        btn.classList.toggle('sentinel-active', this.state.sentinel);
        txt.textContent = this.state.sentinel ? 'ON' : 'OFF';
      }
      toggleVideo() {
        this.state.video = !this.state.video;
        const btn = document.getElementById('vid-toggle');
        const txt = document.getElementById('vid-status');
        btn.classList.toggle('active', this.state.video);
        txt.textContent = this.state.video ? 'ON' : 'OFF';
      }
      toggleVoice() {
        this.state.voice = !this.state.voice;
        const btn = document.getElementById('voice-toggle');
        const txt = document.getElementById('voice-status');
        btn.classList.toggle('active', this.state.voice);
        txt.textContent = this.state.voice ? 'ON' : 'OFF';
      }
      toggleDictate() {
        this.state.dictate = !this.state.dictate;
        const btn = document.getElementById('dictate-toggle');
        const txt = document.getElementById('dictate-status');
        btn.classList.toggle('active', this.state.dictate);
        txt.textContent = this.state.dictate ? 'ON' : 'OFF';
      }
      toggleChron() {
        this.state.chron = !this.state.chron;
        const btn = document.getElementById('chron-toggle');
        const txt = document.getElementById('chron-status');
        btn.classList.toggle('active', this.state.chron);
        txt.textContent = this.state.chron ? 'ON' : 'OFF';
      }
      recordVoiceNote() { alert('Voice Note active.'); }
      showVoiceSettings() { alert('Voice settings nominal.'); }
      clearTerminal() { document.getElementById('terminal-stream').innerHTML = ''; }
      switchTab(name, el) {
        document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`${name}-view`).classList.add('active');
        el.classList.add('active');
      }
      sendPrompt() {
        const input = document.getElementById('prompt-input');
        if (!input.value.trim()) return;
        const stream = document.getElementById('terminal-stream');
        stream.innerHTML += `<div class="terminal-card"><div class="card-text" style="color:var(--primary-cyan);">&gt; ${input.value}</div></div>`;
        input.value = '';
      }
      copyText(btn) {
        navigator.clipboard.writeText(btn.closest('.terminal-card').querySelector('.card-text').innerText);
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      }
    }
    const runtime = new PG1SovereignRuntime();
  </script>
</body>
</html>
