<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gifted1™ | Command Center</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-blue: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-red: #f87171;
            --success-green: #4ade80;
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--success-green);
            border-radius: 50%;
            display: inline-block;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .video-box {
            width: 100%;
            height: 220px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 16px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn {
            width: 100%;
            background-color: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            opacity: 0.85;
        }

        .terminal-box {
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            height: 140px;
            overflow-y: auto;
            color: var(--text-muted);
        }

        .terminal-box .sys { color: var(--accent-blue); }
        .terminal-box .err { color: var(--error-red); }
        .terminal-box .ok { color: var(--success-green); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><span class="status-dot"></span> Project Gifted1™</h1>
            <span style="font-size: 0.85rem; color: var(--text-muted);">v2.4 Node</span>
        </header>

        <!-- Video Stream Card -->
        <div class="card">
            <div class="video-box">
                <!-- Video element must be muted and playsinline for iOS -->
                <video id="webcam" autoplay playsinline muted></video>
            </div>
            <button id="stream-btn" class="btn">📹 Initialize Live Stream Feed</button>
        </div>

        <!-- Terminal Output -->
        <div class="card">
            <div id="terminal" class="terminal-box">
                > [SYSTEM]: Secure terminal initialized. Ready for instructions.<br>
            </div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const videoElement = document.getElementById('webcam');
        const streamBtn = document.getElementById('stream-btn');

        function logToTerminal(message, type = 'sys') {
            const timestamp = new Date().toLocaleTimeString();
            let colorClass = 'sys';
            if (type === 'err') colorClass = 'err';
            if (type === 'ok') colorClass = 'ok';
            
            terminal.innerHTML += `> [<span class="${colorClass}">${timestamp}</span>]: ${message}<br>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Attached synchronously to respect iOS user gesture constraints
        streamBtn.addEventListener('click', function() {
            logToTerminal("Requesting media stream permissions...");

            // Must call getUserMedia synchronously inside the event loop without prior await
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user' }, 
                audio: false 
            })
            .then(function(stream) {
                videoElement.srcObject = stream;
                logToTerminal("Live stream feed initialized successfully.", "ok");
            })
            .catch(function(error) {
                logToTerminal(`Media stream failed – ${error.name}: ${error.message}`, "err");
            });
        });
    </script>
</body>
</html>
