<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PG1 Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Control Header -->
        <div class="terminal-header">
            <div class="title">PG1 Agent Control Panel</div>
            <div class="controls">
                <button id="btn-video" onclick="toggleVideo()">Video: OFF</button>
                <button id="btn-audio" onclick="toggleAudio()">Audio: OFF</button>
                <button id="btn-voice" onclick="toggleVoice()">Voice: OFF</button>
                <button onclick="copyLogs()">Copy Logs</button>
                <button onclick="clearLogs()">Clear</button>
            </div>
        </div>

        <!-- Video Stream Container -->
        <div id="video-container" class="video-container hidden">
            <video id="webcam-preview" autoplay playsinline muted></video>
            <canvas id="frame-canvas" class="hidden"></canvas>
        </div>

        <!-- Workspace Section -->
        <div class="main-workspace">
            <div class="panel">
                <h3>System Console Logs</h3>
                <div id="terminal-logs" class="log-output">
                    <div>> PG1 System Initialized. Ready for commands.</div>
                </div>
            </div>

            <div class="panel">
                <h3>AI Conversation Thread</h3>
                <div id="chat-thread" class="chat-output">
                    <div class="msg ai-msg"><strong>PG1 Agent:</strong> Hello! How can I assist you today?</div>
                </div>
            </div>
        </div>

        <!-- Bottom Input Bar -->
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Enter command or message..." onkeydown="handleKeyPress(event)">
            <button onclick="sendCommand()">Send</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
