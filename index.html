<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gifted1 | Sovereign Agent Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .dashboard {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.15rem;
            color: var(--accent);
            margin: 0;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            color: var(--success);
            background: rgba(34, 197, 94, 0.1);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }
        .chat-container {
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-main);
            height: 200px;
            overflow-y: auto;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5Rem;
            text-align: left;
        }
        .message {
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            max-width: 90%;
        }
        .message.agent {
            background: #1e293b;
            color: var(--accent);
            border-left: 3px solid var(--accent);
        }
        .message.operator {
            background: #0f172a;
            color: var(--text-muted);
            align-self: flex-end;
            border-right: 3px solid #64748b;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
        }
        input[type="text"] {
            flex: 1;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.75rem;
            color: var(--text-main);
            font-size: 0.9rem;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }
        button:active {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>PG1 Sovereign Node</h1>
            <div class="status-badge">
                <div class="dot"></div>
                Active
            </div>
        </div>
        
        <div class="chat-container" id="chatLog">
            <div class="message agent">[PG1-AI]: Sovereign node online. Automated creator workflow and telemetry protocols primed. Enter command or query.</div>
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="Enter command..." onkeydown="if(event.key === 'Enter') sendCommand()">
            <button onclick="sendCommand()">Send</button>
        </div>
    </div>

    <script>
        function sendCommand() {
            const input = document.getElementById('userInput');
            const chatLog = document.getElementById('chatLog');
            const text = input.value.trim();
            if (!text) return;

            // Append Operator Message
            chatLog.innerHTML += `<div class="message operator">Operator: ${escapeHtml(text)}</div>`;
            input.value = '';
            chatLog.scrollTop = chatLog.scrollHeight;

            // Simulate PG1 Response Logic
            setTimeout(() => {
                let reply = "Telemetry verified. Node network operational.";
                const lower = text.toLowerCase();
                if (lower.includes('status') || lower.includes('node')) {
                    reply = "All decentralized node routes secure. Zero leakage detected.";
                } else if (lower.includes('campaign') || lower.includes('creator')) {
                    reply = "Autonomous creator gifting pipeline active. Administrative overhead minimized.";
                } else if (lower.includes('security') || lower.includes('safety')) {
                    reply = "Safety-first protocols engaged. Sovereign parameters enforced.";
                }

                chatLog.innerHTML += `<div class="message agent">[PG1-AI]: ${reply}</div>`;
                chatLog.scrollTop = chatLog.scrollHeight;
            }, 500);
        }

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
