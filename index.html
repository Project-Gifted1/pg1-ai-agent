<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Live Mobile Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 8px; color: #fff; }
        .config-box, .control-box {
            width: 100%;
            max-width: 400px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        input, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            outline: none;
        }
        button {
            background-color: #1a73e8;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button.active {
            background-color: #d93025;
        }
        #camera-container {
            width: 100%;
            max-width: 400px;
            height: 300px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #status {
            font-size: 14px;
            color: #aaa;
            text-align: center;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <h2>Gemini Live Stream</h2>
    <div id="status">Status: Disconnected</div>

    <div class="config-box">
        <input type="password" id="apiKey" placeholder="Enter Gemini API Key">
    </div>

    <div id="camera-container">
        <video id="camera-stream" autoplay playsinline muted></video>
    </div>

    <div class="control-box">
        <button id="toggleBtn" onclick="toggleLiveSession()">Connect & Start Stream</button>
    </div>

    <script>
        let liveWs = null;
        let mediaStream = null;
        let frameInterval = null;
        let audioContext = null;
        let nextPlayTime = 0;
        let isConnected = false;

        async function startCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: false 
                });
                document.getElementById('camera-stream').srcObject = mediaStream;
            } catch (err) {
                alert("Camera permission denied or unavailable: " + err.message);
            }
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        async function toggleLiveSession() {
            const btn = document.getElementById('toggleBtn');
            const apiKey = document.getElementById('apiKey').value.trim();

            if (!apiKey) {
                alert("Please enter a valid API key.");
                return;
            }

            if (!isConnected) {
                await startCamera();
                connectWebSocket(apiKey);
            } else {
                disconnectWebSocket();
            }
        }

        function connectWebSocket(apiKey) {
            updateStatus("Connecting to Live API...");
            
            // Using the Live API v1beta endpoint
            const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
            liveWs = new WebSocket(url);

            liveWs.onopen = () => {
                updateStatus("Connected. Initializing session...");
                
                // Send mandatory setup configuration
                const setupMessage = {
                    setup: {
                        model: "models/gemini-2.0-flash-exp",
                        generationConfig: {
                            responseModalities: ["AUDIO"]
                        }
                    }
                };
                liveWs.send(JSON.stringify(setupMessage));

                // Initialize Audio Context for output playback
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                nextPlayTime = audioContext.currentTime;

                startVideoLoop();
                
                isConnected = true;
                const btn = document.getElementById('toggleBtn');
                btn.textContent = "Disconnect";
                btn.classList.add('active');
                updateStatus("Status: Live & Streaming Video");
            };

            liveWs.onmessage = async (event) => {
                let responseText = event.data;
                if (event.data instanceof Blob) {
                    responseText = await event.data.text();
                }
                const response = JSON.parse(responseText);
                handleServerResponse(response);
            };

            liveWs.onerror = (error) => {
                console.error("WebSocket Error:", error);
                updateStatus("Error: Connection failure");
            };

            liveWs.onclose = () => {
                disconnectWebSocket();
                updateStatus("Status: Disconnected");
            };
        }

        function disconnectWebSocket() {
            if (liveWs) {
                liveWs.close();
                liveWs = null;
            }
            if (frameInterval) {
                clearInterval(frameInterval);
                frameInterval = null;
            }
            stopCamera();

            isConnected = false;
            const btn = document.getElementById('toggleBtn');
            btn.textContent = "Connect & Start Stream";
            btn.classList.remove('active');
            updateStatus("Status: Disconnected");
        }

        function startVideoLoop() {
            const videoElement = document.getElementById('camera-stream');
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');

            // Send video frames at 1 frame per second to maintain performance and stay within limits
            frameInterval = setInterval(() => {
                if (!liveWs || liveWs.readyState !== WebSocket.OPEN || !videoElement.videoWidth) return;

                canvas.width = videoElement.videoWidth * 0.5;
                canvas.height = videoElement.videoHeight * 0.5;
                context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                const base64Data = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];

                const mediaChunk = {
                    realtime_input: {
                        media_chunks: [
                            {
                                mime_type: "image/jpeg",
                                data: base64Data
                            }
                        ]
                    }
                };
                liveWs.send(JSON.stringify(mediaChunk));
            }, 1000);
        }

        function handleServerResponse(response) {
            if (response.serverContent && response.serverContent.modelTurn) {
                const parts = response.serverContent.modelTurn.parts;
                for (const part of parts) {
                    if (part.inlineData && part.inlineData.mimeType.startsWith("audio/")) {
                        playAudioChunk(part.inlineData.data);
                    }
                }
            }
        }

        function playAudioChunk(base64Audio) {
            if (!audioContext) return;

            const binaryString = atob(base64Audio);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            const pcm16 = new Int16Array(bytes.buffer);
            const float32 = new Float32Array(pcm16.length);
            for (let i = 0; i < pcm16.length; i++) {
                float32[i] = pcm16[i] / 32768.0;
            }

            const audioBuffer = audioContext.createBuffer(1, float32.length, 24000);
            audioBuffer.getChannelData(0).set(float32);

            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);

            const currentTime = audioContext.currentTime;
            if (nextPlayTime < currentTime) {
                nextPlayTime = currentTime;
            }
            source.start(nextPlayTime);
            nextPlayTime += audioBuffer.duration;
        }

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }
    </script>
</body>
</html>
