<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Gifted1™</title>
  <style>
    /* Global Container Setup */
    body {
      background-color: #0b0f19;
      color: #00ffcc;
      font-family: monospace;
      margin: 0;
      padding: 10px;
    }

    /* Global Header Action Bar (Stays Visible Everywhere) */
    .global-action-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      justify-content: space-between;
    }

    .btn-toggle {
      background-color: #0a192f;
      border: 1px solid #0055ff;
      color: #00bfff;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-danger {
      border-color: #ff3333;
      color: #ff3333;
    }

    /* Tab Content Visibility Logic */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Bottom Navigation Styling */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      background: #070a10;
      border-top: 1px solid #1a2332;
      padding: 10px 0;
    }

    .nav-item {
      color: #556b82;
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #00ffcc;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Persistent Global Action Bar -->
  <div class="global-action-bar">
    <button class="btn-toggle" id="btn-video" onclick="toggleMedia('video')">Video: OFF</button>
    <button class="btn-toggle" id="btn-audio" onclick="toggleMedia('audio')">Audio: OFF</button>
    <button class="btn-toggle" id="btn-voice" onclick="toggleMedia('voice')">Voice: OFF</button>
    <button class="btn-toggle btn-danger" onclick="deleteThread()">Delete Thread</button>
  </div>

  <!-- Tab 1: Dash -->
  <div id="tab-dash" class="tab-content active">
    <!-- Key Relay Box & Dashboard Widgets Go Here -->
    <div style="border: 1px solid #1a2332; padding: 15px; border-radius: 6px;">
      <h3 style="margin-top:0;">⚡ x402 Sovereign Key Relay</h3>
      <p style="font-size: 12px; color: #8a99ad;">Stored strictly in browser memory for direct client-side requests.</p>
    </div>
  </div>

  <!-- Tab 2: Terminal -->
  <div id="tab-terminal" class="tab-content">
    <div style="border: 1px solid #1a2332; padding: 15px; border-radius: 6px;">
      <p style="color: #00ffcc;">> PG1 System Initialized. Ready for multimodal commands.</p>
    </div>
  </div>

  <!-- Tab 3: Node -->
  <div id="tab-node" class="tab-content">
    <div style="border: 1px solid #1a2332; padding: 15px; border-radius: 6px; text-align: center;">
      <h3>PG1.Agent</h3>
      <p style="color: #00ff88;">Status: Online & Syncing</p>
    </div>
  </div>

  <!-- Persistent Navigation Footer -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('dash', this)">Dash</button>
    <button class="nav-item" onclick="switchTab('terminal', this)">Terminal</button>
    <button class="nav-item" onclick="switchTab('node', this)">Node</button>
  </div>

  <script>
    // Tab Router Switcher
    function switchTab(tabName, btnElement) {
      // Hide all tabs
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });

      // Remove active status from all navigation items
      document.querySelectorAll('.nav-item').forEach(nav => {
        nav.classList.remove('active');
      });

      // Show selected tab and highlight nav button
      document.getElementById('tab-' + tabName).classList.add('active');
      btnElement.classList.add('active');
    }

    // Media Toggle Handler
    const mediaStates = { video: false, audio: false, voice: false };

    function toggleMedia(type) {
      mediaStates[type] = !mediaStates[type];
      const btn = document.getElementById(`btn-${type}`);
      const label = type.charAt(0).toUpperCase() + type.slice(1);
      
      btn.innerText = `${label}: ${mediaStates[type] ? 'ON' : 'OFF'}`;
      btn.style.borderColor = mediaStates[type] ? '#00ffcc' : '#0055ff';
      btn.style.color = mediaStates[type] ? '#00ffcc' : '#00bfff';
    }

    function deleteThread() {
      if (confirm('Are you sure you want to delete this thread?')) {
        console.log('Thread cleared');
      }
    }
  </script>
</body>
</html>
