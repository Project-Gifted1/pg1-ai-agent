<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PG1 Agent Console</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background-color: #0b1120;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      color: #f8fafc;
    }

    .terminal {
      width: 100%;
      height: 280px;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      overflow-y: auto;
      margin-bottom: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .terminal div {
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: white;
      cursor: pointer;
      padding: 12px 14px;
      transition: background-color 0.2s;
    }

    #voiceToggleBtn {
      background-color: #0284c7;
      min-width: 95px;
    }

    #speechOutputBtn {
      background-color: #10b981;
      min-width: 110px;
    }

    #cmdInput {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      padding: 0 12px;
      font-size: 0.9rem;
      outline: none;
    }

    #cmdInput:focus {
      border-color: #38bdf8;
    }

    #executeBtn {
      background-color: #0284c7;
    }

    #micStatus.recording {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      margin-left: 6px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>PG1 Agent Console <span id="micStatus"></span></h2>
    
    <div id="terminal" class="terminal"></div>

    <div class="controls">
      <button id="speechOutputBtn" onclick="toggleAudioOutput()">Audio: ON</button>
      <button id="voiceToggleBtn" onclick="toggleVoice()">Voice: OFF</button>
    </div>

    <div class="controls" style="margin-top: 10px;">
      <input type="text" id="cmdInput" placeholder="Type or speak command..." onkeypress="if(event.key==='Enter') handleManualSend()" />
      <button id="executeBtn" onclick="handleManualSend()">Execute</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
