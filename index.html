<!-- DASHBOARD VIEW -->
<div id="view-dash" class="tab-view active-view">
  <div class="card">
    <h3>Sovereign Edge Active</h3>
    <p class="subtitle">Zero-cost deployment operational via PG1 core edge synchronization. All telemetry feeds secure.</p>
    
    <div style="margin-bottom: 15px; font-weight: bold; font-size: 0.9rem; color: #fff;">
      ⚡ Real-Time Edge Telemetry
    </div>

    <div class="metric-group">
      <div class="metric-label">
        <span>CPU Utilization</span>
        <span id="telemetry-cpu-text">36%</span>
      </div>
      <div class="progress-bar">
        <div id="telemetry-cpu-bar" class="fill" style="width: 36%;"></div>
      </div>
    </div>

    <div class="metric-group">
      <div class="metric-label">
        <span>Memory Consumption</span>
        <span id="telemetry-mem-text">49%</span>
      </div>
      <div class="progress-bar">
        <div id="telemetry-mem-bar" class="fill green" style="width: 49%;"></div>
      </div>
    </div>

    <div class="metric-group">
      <div class="metric-label">
        <span>Network Bandwidth Throughput</span>
        <span id="telemetry-net-text">1.8 MB/s</span>
      </div>
      <div class="progress-bar">
        <div id="telemetry-net-bar" class="fill" style="width: 60%;"></div>
      </div>
    </div>
  </div>
</div>
