<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PG1 Sovereign AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0a0c10;
      --bg-secondary: #12151e;
      --bg-card: #181d2a;
      --border-color: #262c3e;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --text-main: #e2e8f0;
      --text-muted: #8892b0;
      --user-msg-bg: #1c2438;
      --bot-msg-bg: #141926;
      --gemini-badge: #4facfe;
      --openrouter-badge: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 14px;
      color: #0a0c10;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .message-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .message {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border-color);
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg-bg);
      border-color: #2b395b;
      max-width: 80%;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg-bg);
      max-width: 90%;
    }

    .badge-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.05em;
    }

    .badge-gemini {
      background: rgba(79, 172, 254, 0.15);
      color: var(--gemini-badge);
      border: 1px solid rgba(79, 172, 254, 0.3);
    }

    .badge-openrouter {
      background: rgba(16, 185, 129, 0.15);
      color: var(--openrouter-badge);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      padding: 16px 24px;
    }

    .input-wrapper {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      position: relative;
    }

    textarea {
      flex: 1;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      height: 48px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent-cyan);
    }

    button.send-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border: none;
      color: #0a0c10;
      font-weight: 600;
      padding: 0 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    button.send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading-pulse {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--accent-cyan);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">PG1</div>
      <span class="brand-title">Sovereign AI Agent</span>
    </div>
    <div class="brand-status">
      <span class="status-dot"></span>
      <span>DYNAMIC ROUTER ONLINE</span>
    </div>
  </header>

  <main id="chat-stream">
    <div class="message-container">
      <div class="message bot">
        Greetings. PG1 Sovereign Agent is connected. Submit a prompt or code task to initiate the dynamic model router.
      </div>
    </div>
  </main>

  <footer>
    <div class="input-wrapper">
      <textarea id="user-input" placeholder="Type your instruction or code analysis request..." rows="1"></textarea>
      <button id="send-btn" class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </footer>

  <script>
    const chatStream = document.getElementById('chat-stream');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const prompt = userInput.value.trim();
      if (!prompt) return;

      userInput.value = '';
      appendMessage('user', prompt);
      sendBtn.disabled = true;

      const loadingContainer = appendLoading();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await res.json();
        loadingContainer.remove();

        if (!res.ok) {
          appendMessage('bot', `Error: ${data.error || 'Request failed'}`);
        } else {
          appendMessage('bot', data.reply, data.provider, data.model);
        }
      } catch (err) {
        loadingContainer.remove();
        appendMessage('bot', `Network error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    function appendMessage(role, text, provider, model) {
      const container = document.createElement('div');
      container.className = 'message-container';

      if (provider && model) {
        const badgeBar = document.createElement('div');
        badgeBar.className = 'badge-bar';
        badgeBar.innerHTML = `<span class="badge badge-${provider}">${provider}</span> <span>${model}</span>`;
        container.appendChild(badgeBar);
      }

      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      container.appendChild(msg);

      chatStream.appendChild(container);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function appendLoading() {
      const container = document.createElement('div');
      container.className = 'message-container';
      const msg = document.createElement('div');
      msg.className = 'message bot';
      msg.innerHTML = '<span class="loading-pulse"></span> Routing request...';
      container.appendChild(msg);
      chatStream.appendChild(container);
      chatStream.scrollTop = chatStream.scrollHeight;
      return container;
    }
  </script>
</body>
</html>
