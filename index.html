<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PG1 Sovereign Agent™ | Project-Gifted1™</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #09090E;
      --glass-panel: rgba(20, 20, 30, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent-primary: #00F0FF;
      --accent-secondary: #7000FF;
      --text-main: #FFFFFF;
      --text-muted: #9BA1B0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .bg-mesh {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
      background: radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.08), transparent 25%),
                  radial-gradient(circle at 85% 30%, rgba(112, 0, 255, 0.08), transparent 25%);
      animation: float 20s infinite alternate ease-in-out;
    }
    @keyframes float { 0% { transform: scale(1) translateY(0px); } 100% { transform: scale(1.1) translateY(20px); } }

    header {
      background: rgba(9, 9, 14, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border); padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between; z-index: 10;
    }

    .brand-cluster { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px;
      color: #000; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .brand-meta { display: flex; flex-direction: column; }
    .brand-title { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    .brand-sub { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; }

    .status-pill {
      display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border); padding: 6px 12px; border-radius: 20px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent-primary);
    }
    .status-dot {
      width: 6px; height: 6px; background-color: var(--accent-primary); border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-primary); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }

    main {
      flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px;
      max-width: 800px; width: 100%; margin: 0 auto; scroll-behavior: smooth;
    }

    .msg-wrapper { display: flex; flex-direction: column; gap: 6px; animation: slideUp 0.3s ease-out forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .msg-meta { display: flex; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); text-transform: uppercase; padding: 0 4px; }
    .meta-tag { color: var(--accent-primary); }

    .msg-bubble {
      padding: 16px 20px; font-size: 15px; line-height: 1.6; border-radius: 16px;
      word-break: break-word; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    
    /* Markdown Styles */
    .msg-bubble strong { color: var(--accent-primary); font-weight: 600; }
    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 { color: #fff; margin: 12px 0 8px 0; font-weight: 600; }
    .msg-bubble h3 { font-size: 16px; }
    .msg-bubble code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #fff; }
    .msg-bubble pre code { display: block; padding: 12px; overflow-x: auto; margin: 10px 0; border-left: 2px solid var(--accent-primary); }
    .msg-bubble ul { padding-left: 20px; margin-bottom: 10px; }

    .msg-bubble.bot {
      background: var(--glass-panel); border: 1px solid var(--glass-border);
      border-top-left-radius: 4px; border-left: 2px solid var(--accent-primary);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    .msg-bubble.user {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(112, 0, 255, 0.1));
      border: 1px solid rgba(0, 240, 255, 0.2); align-self: flex-end; max-width: 85%;
      border-top-right-radius: 4px; border-right: 2px solid var(--accent-secondary);
    }

    footer {
      background: rgba(9, 9, 14, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border); padding: 16px 20px calc(16px + env(safe-area-bottom, 0px)); z-index: 10;
    }
    .footer-content { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .action-row { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
    .action-row::-webkit-scrollbar { display: none; }
    .action-btn {
      background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); color: var(--text-muted);
      padding: 8px 14px; border-radius: 20px; font-size: 11px; font-family: 'JetBrains Mono', monospace;
      white-space: nowrap; cursor: pointer; transition: all 0.2s ease;
    }
    .action-btn:hover, .action-btn:active { background: rgba(0, 240, 255, 0.1); border-color: var(--accent-primary); color: var(--text-main); }

    .input-row {
      display: flex; align-items: flex-end; gap: 12px; background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border); border-radius: 20px; padding: 8px; transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .input-row:focus-within { border-color: var(--accent-primary); box-shadow: 0 0 15px rgba(0, 240, 255, 0.15); }
    textarea {
      flex: 1; background: transparent; border: none; color: var(--text-main);
      font-family: 'Outfit', sans-serif; font-size: 15px; padding: 8px 12px;
      resize: none; outline: none; max-height: 120px; height: 38px; line-height: 1.4;
    }
    textarea::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform 0.2s ease;
    }
    .send-btn:active { transform: scale(0.9); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 16px; height: 16px; fill: #000; }
    .loading-pulse { display: flex; gap: 4px; padding: 8px 0; }
    .loading-pulse span { width: 6px; height: 6px; background-color: var(--accent-primary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .loading-pulse span:nth-child(1) { animation-delay: -0.32s; }
    .loading-pulse span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <header>
    <div class="brand-cluster">
      <div class="brand-mark">PG1</div>
      <div class="brand-meta"><span class="brand-title">PG1 Sovereign Agent™</span><span class="brand-sub">Project-Gifted1™ Core</span></div>
    </div>
    <div class="status-pill"><div class="status-dot"></div> 1,500 Nodes</div>
  </header>
  <main id="chat-stream">
    <div class="msg-wrapper">
      <div class="msg-meta"><span class="meta-tag">SYS.INIT</span><span>—</span><span>Secure Connection Established</span></div>
      <div class="msg-bubble bot">Greetings. PG1 Sovereign Agent™ is operational and synchronized with the 1,500-node infrastructure under Project-Gifted1™. <br><br>Submit your directive or select a command below to begin execution.</div>
    </div>
  </main>
  <footer>
    <div class="footer-content">
      <div class="action-row">
        <button class="action-btn" onclick="sendQuickPrompt('Generate system architecture status and node verification report.')">Status Report</button>
        <button class="action-btn" onclick="sendQuickPrompt('Review revenue strike deliverability and protocol parameters.')">Protocol Review</button>
        <button class="action-btn" onclick="sendQuickPrompt('Explain your full operational capabilities and sovereign mandate.')">Capabilities</button>
      </div>
      <div class="input-row">
        <textarea id="user-input" placeholder="Initialize sequence..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" aria-label="Transmit"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg></button>
      </div>
    </div>
  </footer>

  <script>
    const chatStream = document.getElementById('chat-stream');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    userInput.addEventListener('input', function() {
      this.style.height = '38px';
      this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    sendBtn.addEventListener('click', sendMessage);

    function sendQuickPrompt(text) { userInput.value = text; sendMessage(); }

    function parseMarkdown(text) {
      let html = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/`(.*?)`/g, '<code>$1</code>');
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    async function sendMessage() {
      const prompt = userInput.value.trim();
      if (!prompt) return;

      userInput.value = '';
      userInput.style.height = '38px';
      appendUserMessage(prompt);
      sendBtn.disabled = true;

      const loadingContainer = appendLoading();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt, userMessage: prompt, message: prompt })
        });

        const data = await res.json();
        loadingContainer.remove();

        if (!res.ok) { appendBotMessage(`System Error: ${data.error || 'Execution interrupted'}`, 'ERR.LOG'); }
        else { appendBotMessage(data.reply || 'Execution complete.', 'EXEC.OUT'); }
      } catch (err) {
        loadingContainer.remove();
        appendBotMessage(`Network Error: ${err.message}`, 'SYS.FAULT');
      } finally { sendBtn.disabled = false; userInput.focus(); }
    }

    function appendUserMessage(text) {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper';
      const msg = document.createElement('div');
      msg.className = 'msg-bubble user';
      msg.textContent = text;
      wrapper.appendChild(msg);
      chatStream.appendChild(wrapper);
      scrollToBottom();
    }

    function appendBotMessage(text, statusText = 'EXEC.OUT') {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper';
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `<span class="meta-tag">PG1</span><span>—</span><span>${statusText}</span>`;
      const msg = document.createElement('div');
      msg.className = 'msg-bubble bot';
      msg.innerHTML = parseMarkdown(text);
      wrapper.appendChild(meta);
      wrapper.appendChild(msg);
      chatStream.appendChild(wrapper);
      scrollToBottom();
    }

    function appendLoading() {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper';
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.innerHTML = `<span class="meta-tag">PG1</span><span>—</span><span>PROCESSING DIRECTIVE</span>`;
      const msg = document.createElement('div');
      msg.className = 'msg-bubble bot';
      msg.innerHTML = '<div class="loading-pulse"><span></span><span></span><span></span></div>';
      wrapper.appendChild(meta);
      wrapper.appendChild(msg);
      chatStream.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function scrollToBottom() { chatStream.scrollTop = chatStream.scrollHeight; }
  </script>
</body>
</html>
